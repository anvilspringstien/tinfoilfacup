name: Scan FA Cup draw (guarded)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a newly validated official draw?"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "37 * * * *"
  push:
    paths:
      - "updater/guard_publication_base.py"
      - "tests/test_competition_publication.py"
      - "updater/auto_draw.py"
      - "updater/draw_ball_numbers.py"
      - "updater/active_conditional_refresh_regression.py"
      - ".github/workflows/scan-draw.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: competition-state-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Resolve the branch again after waiting for the shared writer lock.
          ref: ${{ github.ref_name }}

      - name: Guard publication serialization and stale candidate rejection
        run: python -m unittest discover -s tests -p 'test_competition_publication.py' -v

      - name: Record candidate input revision
        run: git rev-parse HEAD > "$RUNNER_TEMP/competition-build-base"

      - name: Guard active-round conditional resolution
        run: python updater/active_conditional_refresh_regression.py

      - name: Detect and validate official FA draw state
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          # Scheduled scans and guarded watcher-code pushes publish only after
          # auto_draw.py has passed its structural validation. Manual runs may
          # still request a dry run by setting publish=false.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            python updater/auto_draw.py --publish
          else
            python updater/auto_draw.py
          fi

      - name: Stage verified pre-draw announcement
        env:
          ANNOUNCEMENT_URL: ${{ vars.TFFC_DRAW_ANNOUNCEMENT_URL || 'https://www.thefa.com/news/2026/nov/06/emirates-fa-cup-second-round-draw-to-be-broadcast-on-tnt-sports-20260611' }}
          ANNOUNCEMENT_ROUND: ${{ vars.TFFC_DRAW_ANNOUNCEMENT_ROUND || 'Second Round Proper' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if ! PYTHONPATH=updater python -c '
          import json, os
          from auto_draw import DATA, ROUND_ORDER
          current = json.loads(DATA.read_text()).get("source_round")
          target = os.environ["ANNOUNCEMENT_ROUND"]
          raise SystemExit(0 if current in ROUND_ORDER[:-1] and ROUND_ORDER[ROUND_ORDER.index(current) + 1] == target else 1)
          '; then
            echo "Configured announcement is for a different round."
            exit 0
          fi
          stage=()
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            stage=(--stage)
          fi
          if ! python updater/draw_ball_numbers.py "$ANNOUNCEMENT_URL" --round "$ANNOUNCEMENT_ROUND" "${stage[@]}"; then
            echo "::warning::Pre-draw announcement could not be verified. No preview update was staged."
          fi

      - name: Validate canonical JSON
        run: python -m json.tool competition.json >/dev/null

      - name: Upload draw-watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draw-watch-report
          path: updater/draw-watch-report.json

      - name: Commit validated new draw
        id: commit_draw
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          git config user.name "Tin Foil FA Cup Draw Watcher"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json updater/draw-watch-report.json
          if git diff --cached --quiet; then
            echo "No new official draw to publish."
          else
            # Do not create hourly report-only commits: competition.json must have changed.
            if git diff --cached --quiet -- competition.json; then
              echo "Official draw state unchanged; report retained only as workflow artifact."
              git reset
            else
              git commit -m "Auto-import validated FA Cup draw"
              TARGET_BRANCH="$GITHUB_REF_NAME"
              git pull --rebase origin "$TARGET_BRANCH"
              python updater/guard_publication_base.py --base "$(cat "$RUNNER_TEMP/competition-build-base")" --upstream "origin/$TARGET_BRANCH"
              python -m json.tool competition.json >/dev/null
              python updater/active_conditional_refresh_regression.py
              python updater/competition_regression_guard.py
              git push origin "HEAD:$TARGET_BRANCH"
              echo "published=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Commits created with GITHUB_TOKEN deliberately do not trigger ordinary
      # push workflows. Explicit workflow_dispatch is therefore required so a
      # promoted draw always gets the same chronology, Clubfinder and regression
      # checks as a human-authored competition.json change.
      - name: Dispatch Competition Health after promotion
        if: ${{ steps.commit_draw.outputs.published == 'true' && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run competition-health.yml --ref main
