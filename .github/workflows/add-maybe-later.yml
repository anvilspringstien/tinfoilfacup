name: Add Maybe Later to Challenges splash

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-maybe-later.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Maybe Later only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("beta/challenges-beta.html")
          s = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              s = s.replace(old, new, 1)

          replace_once(
              '''      <div class="actions">
                <button id="openDeck" class="challenge-btn beta-splash-go">Challenges</button>
              </div>''',
              '''      <div class="actions">
                <button id="openDeck" class="challenge-btn beta-splash-go">Challenges</button>
                <button id="maybeLater" class="challenge-btn beta-splash-later" type="button">Maybe Later</button>
              </div>''',
              "splash buttons",
          )

          anchor = '''#openDeck.challenge-btn.beta-splash-go:active{
            transform:translateY(1px)!important;
            box-shadow:0 2px 0 #7c6511!important;
          }'''
          extra = '''
          .hero.beta-splash .actions{justify-content:flex-start;gap:12px;flex-wrap:nowrap;margin-top:0}
          .hero.beta-splash .actions #openDeck,
          .hero.beta-splash .actions #maybeLater{
            width:165px!important;
            min-width:0!important;
            max-width:calc((100% - 12px)/2)!important;
            flex:0 1 165px;
          }
          #maybeLater.challenge-btn.beta-splash-later{
            margin-top:11px!important;
            height:44px!important;
            padding:0 22px!important;
            border:2px solid #fafafa!important;
            border-radius:9px!important;
            background:#084c61!important;
            color:#fafafa!important;
            box-shadow:0 3px 0 #04323f!important;
            font:800 13px/1 Arial,Helvetica,sans-serif!important;
            letter-spacing:.045em!important;
          }
          #maybeLater.challenge-btn.beta-splash-later:hover,
          #maybeLater.challenge-btn.beta-splash-later:focus-visible{
            filter:brightness(1.08)!important;
            color:#fff!important;
            border-color:#fff!important;
            box-shadow:0 3px 0 #04323f!important;
            transform:none!important;
          }
          #maybeLater.challenge-btn.beta-splash-later:active{
            transform:translateY(1px)!important;
            box-shadow:0 2px 0 #04323f!important;
          }'''
          replace_once(anchor, anchor + extra, "Maybe Later CSS")

          replace_once(
              '''$("openDeck").onclick=()=>{ document.body.classList.remove("tffc-stats-view"); openAt(0); };
          $("deckStatsBtn").onclick=()=>{ openCampaignStatsFromDeck(); };''',
              '''$("openDeck").onclick=()=>{ document.body.classList.remove("tffc-stats-view"); openAt(0); };
          $("maybeLater").onclick=(e)=>{
            /* CANDIDATE 13 — same-tab return to the exact Clubfinder Campaign. */
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            history.back();
          };
          $("deckStatsBtn").onclick=()=>{ openCampaignStatsFromDeck(); };''',
              "Maybe Later handler",
          )

          if s.count('id="maybeLater"') != 1:
              raise SystemExit("Maybe Later button post-check failed")
          if '#084c61' not in s:
              raise SystemExit("Maybe Later teal post-check failed")

          path.write_text(s, encoding="utf-8")
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html = Path("beta/challenges-beta.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          for i, code in enumerate(scripts):
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                  f.write(code)
                  p = f.name
              subprocess.run(["node", "--check", p], check=True)
              Path(p).unlink(missing_ok=True)
          print(f"Checked {len(scripts)} inline scripts")
          PY

      - name: Commit splash change
        run: |
          git config user.name "Tin Foil FA Cup UI"
          git config user.email "actions@users.noreply.github.com"
          git add beta/challenges-beta.html
          git commit -m "Add Maybe Later to Challenges splash"
          git push
