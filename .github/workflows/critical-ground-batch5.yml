name: Critical ground batch 5 (v7.9.10)
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/publish_critical_ground_batch5.py'
      - '.github/workflows/critical-ground-batch5.yml'
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote three validated critical ground records and two groundshares
        run: python updater/publish_critical_ground_batch5.py
      - name: Re-run Ground Health
        run: python updater/ground_health.py
      - name: Commit batch and Ground Health
        run: |
          git config user.name "Tin Foil FA Cup Ground Research"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html updater/ground-approval-ledger.json critical-ground-batch5.md updater/critical-ground-batch5.json ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Publish critical ground batch 5 v7.9.10"; git push; fi
