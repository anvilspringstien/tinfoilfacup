name: Probe public FA results (v7.5.4)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe public FA results surfaces
        run: python updater/public_fa_results_probe.py
      - name: Upload public-results report
        uses: actions/upload-artifact@v4
        with:
          name: public-fa-results-probe
          path: updater/public-fa-results-probe.json
