name: Competition health monitor (v7.9.20)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 19 * * *"
  push:
    paths:
      - "competition.json"
      - "clubfinder.html"
      - "updater/probe_fwp_source.py"
      - "updater/sync_competition_chronology_v2.py"
      - "updater/patch_clubfinder_competition_logic.py"
      - "updater/competition_health.py"
      - "updater/competition_regression_guard.py"
      - ".github/workflows/competition-health.yml"

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe public competition source
        run: python updater/probe_fwp_source.py

      - name: Synchronise competition chronology
        run: python updater/sync_competition_chronology_v2.py

      - name: Apply guarded Clubfinder competition presentation fixes
        run: python updater/patch_clubfinder_competition_logic.py

      - name: Audit full competition chronology
        run: python updater/competition_health.py

      - name: Run competition regression guard
        run: python updater/competition_regression_guard.py

      - name: Commit canonical competition state and health report
        run: |
          git config user.name "Tin Foil FA Cup Health Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json clubfinder.html competition-health.md updater/competition-health.json
          if git diff --cached --quiet; then
            echo "Competition state and health report unchanged."
          else
            git commit -m "Update canonical competition chronology"
            git push
          fi

      - name: Upload competition health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-health
          path: |
            competition-health.md
            updater/competition-health.json
