name: Competition health monitor (v7.9.23)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 19 * * *"
  push:
    paths:
      - "competition.json"
      - "clubfinder.html"
      - "updater/probe_fwp_source.py"
      - "updater/sync_competition_chronology_v2.py"
      - "updater/enrich_later_round_venues.py"
      - "updater/patch_clubfinder_competition_logic.py"
      - "updater/patch_clubfinder_journey_integrity.py"
      - "updater/patch_clubfinder_result_status.py"
      - "updater/patch_clubfinder_branding.py"
      - "updater/competition_health.py"
      - "updater/competition_regression_guard.py"
      - "updater/clubfinder_render_regression.js"
      - "updater/journey_integrity_regression.js"
      - ".github/workflows/competition-health.yml"

permissions:
  contents: write

# Do not let overlapping scheduled/push runs race each other while writing
# competition.json and competition-health.md.
concurrency:
  group: competition-health-main
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe public competition source
        run: python updater/probe_fwp_source.py

      - name: Synchronise competition chronology
        run: python updater/sync_competition_chronology_v2.py

      - name: Enrich later-round fixture venues
        run: python updater/enrich_later_round_venues.py

      # Build the health classification before patching Clubfinder so the exact same
      # grace/overdue state can be embedded into the standalone page users receive.
      - name: Audit full competition chronology
        id: health_audit
        continue-on-error: true
        run: python updater/competition_health.py

      - name: Apply guarded Clubfinder competition presentation fixes
        run: python updater/patch_clubfinder_competition_logic.py

      - name: Apply guarded Clubfinder journey integrity fixes
        run: python updater/patch_clubfinder_journey_integrity.py

      - name: Apply guarded Clubfinder result-status presentation
        run: python updater/patch_clubfinder_result_status.py

      - name: Apply guarded Clubfinder branding fixes
        run: python updater/patch_clubfinder_branding.py

      - name: Run competition regression guard
        run: python updater/competition_regression_guard.py

      - name: Run rendered Clubfinder DL5 regression
        run: node updater/clubfinder_render_regression.js

      - name: Run all-club journey integrity regression
        run: node updater/journey_integrity_regression.js

      - name: Commit canonical competition state and health report
        run: |
          git config user.name "Tin Foil FA Cup Health Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json clubfinder.html competition-health.md updater/competition-health.json
          if git diff --cached --quiet; then
            echo "Competition state and health report unchanged."
          else
            git commit -m "Update canonical competition chronology"
            git pull --rebase origin main
            git push
          fi

      - name: Upload competition health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-health
          path: |
            competition-health.md
            updater/competition-health.json

      - name: Fail run if competition health is critical
        if: ${{ steps.health_audit.outcome == 'failure' }}
        run: |
          echo "Competition health report was published, but the audit is critical."
          exit 1
