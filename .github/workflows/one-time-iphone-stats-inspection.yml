name: One-time read-only iPhone Stats identity inspection
on:
  push:
    branches: ['fix/beta-iphone-stats-identity-wrap-20260925']
    paths:
      - 'updater/inspect_iphone_stats_identity_one_time.py'
      - '.github/workflows/one-time-iphone-stats-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 updater/inspect_iphone_stats_identity_one_time.py
