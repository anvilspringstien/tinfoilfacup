name: Fixture publishability shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches:
      - fixture-publishability-shadow
    paths:
      - "updater/fixture_publishability_shadow.py"
      - "updater/auto_round_results.py"
      - "updater/round_state_engine.py"
      - "updater/clubfinder_render_regression.js"
      - "updater/amersham_card_render_regression.js"
      - "updater/amersham_stats_regression.js"
      - "updater/clubfinder_stats_regression.js"
      - "updater/kt21_venue_render_regression.js"
      - "updater/production_ui_regression.js"
      - ".github/workflows/fixture-publishability-shadow.yml"
permissions:
  contents: read
concurrency:
  group: fixture-publishability-shadow
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard universal round-state chronology
        run: python updater/round_state_regression.py
      - name: Assess fixture-level publishability without mutation
        run: python updater/run_source_resilient.py --label "Fixture publishability shadow" -- python updater/fixture_publishability_shadow.py
      - name: Snapshot production files before candidate simulation
        run: cp competition.json /tmp/competition.before.json && cp clubfinder.html /tmp/clubfinder.before.html
      - name: Build candidate partial state in runner only
        run: python updater/run_source_resilient.py --label "Candidate partial-state result scan" -- python updater/auto_round_results.py --publish
      - name: Reconcile candidate result-history aliases
        run: |
          python updater/reconcile_result_history_aliases.py
          python updater/reconcile_result_history_aliases.py --check
      - name: Apply candidate venue enrichment
        run: |
          python updater/enrich_later_round_venues.py
          python updater/enrich_replay_kickoffs_and_active_venues.py
          python updater/propagate_active_fixture_venues.py
          python updater/propagate_historical_match_venues.py
          python updater/kickoff_venue_regression.py
      - name: Rebuild candidate Clubfinder presentation
        run: |
          python updater/patch_clubfinder_competition_logic.py
          python updater/patch_clubfinder_replay_progression.py
          python updater/patch_clubfinder_journey_integrity.py
          python updater/patch_clubfinder_result_status.py
          python updater/patch_clubfinder_stats_integrity.py
          python updater/patch_clubfinder_branding.py
          python updater/patch_clubfinder_law2_origins.py
          python updater/promote_verified_law2_locations.py
          python updater/audit_law2_location_verification.py
          python updater/patch_clubfinder_historical_venues.py
          python updater/patch_clubfinder_production_ui.py
          python updater/patch_clubfinder_campaign_identity.py
          python updater/refresh_clubfinder_embedded_snapshot.py
      - name: Run candidate competition and Clubfinder guards
        env:
          TFFC_ALLOW_ACTIVE_RESULT_ADVANCE: "1"
        run: |
          python updater/reconcile_result_history_aliases.py --check
          python updater/competition_regression_guard.py
          python updater/extra_preliminary_replay_regression.py
          python updater/replay_completion_guard.py
          node updater/clubfinder_render_regression.js
          node updater/amersham_card_render_regression.js
          node updater/amersham_stats_regression.js
          node updater/ex8_venue_render_regression.js
          node updater/kt21_venue_render_regression.js
          node updater/law2_origin_regression.js
          node updater/replay_progression_regression.js
          python updater/kt21_replay_regression.py
          python updater/embedded_snapshot_regression.py
          node updater/clubfinder_stats_regression.js
          node updater/journey_integrity_regression.js
          node updater/historical_journey_regression.js
          node updater/historical_venue_regression.js
          node updater/production_ui_regression.js
      - name: Record candidate-state delta
        run: |
          git diff --stat -- competition.json clubfinder.html
          git diff --numstat -- competition.json clubfinder.html > updater/fixture-candidate-delta.txt
      - name: Restore production files and prove no production mutation
        if: always()
        run: |
          cp /tmp/competition.before.json competition.json
          cp /tmp/clubfinder.before.html clubfinder.html
          git diff --exit-code -- competition.json clubfinder.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-publishability-shadow
          path: |
            updater/fixture-publishability-shadow.json
            updater/fixture-candidate-delta.txt
