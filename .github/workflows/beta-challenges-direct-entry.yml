name: Guard direct BETA Challenges navigation
on:
  push:
    branches: ['ux/beta-direct-challenges-20260924', 'ux/beta-trophy-viewer-20260925', 'ux/beta-campaign-truth-frame-20260925']
  pull_request:
    paths:
      - 'beta/challenges-beta.html'
      - 'tests/test_beta_challenges_direct_entry.js'
      - 'tests/test_beta_trophy_viewer.js'
      - 'tests/test_beta_campaign_bridge_contract.js'
      - '.github/workflows/beta-challenges-direct-entry.yml'
permissions:
  contents: read
jobs:
  beta-challenges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test direct Deck entry, Trophy Cabinet and persistence
        run: |
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
          node --check tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_campaign_bridge_contract.js
      - name: Preserve unrelated BETA and production regressions
        run: |
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
      - name: Protect production, competition and independent BETA Clubfinder
        run: |
          git fetch origin main
          # This workflow also validates intentional BETA Deck source PRs with all
          # Deck, Trophy, bridge, identity and historical regression tests above.
          # A test-only PR still cannot change either app unless its diff shows it.
          # Clubfinder BETA requires its own separate guarded promotion route.
          git diff --exit-code origin/main...HEAD -- clubfinder.html beta/clubfinder-beta.html competition.json
