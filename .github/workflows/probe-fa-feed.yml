name: Probe FA results feed (v7.5.1)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe official FA endpoints
        run: python updater/fa_feed_probe.py
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: fa-feed-probe-report
          path: updater/fa-feed-probe-report.json
