name: Groundshare evidence confirmation — Batch 2 (v7.8.6)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirm researched groundshare evidence — Batch 2
        run: python updater/groundshare_evidence_confirmation_batch2.py
      - name: Commit confirmation record
        run: |
          git config user.name "Tin Foil FA Cup Groundshare Confirmation"
          git config user.email "actions@users.noreply.github.com"
          git add groundshare-evidence-confirmation-batch2.md updater/groundshare-evidence-confirmation-batch2.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Groundshare evidence confirmation v7.8.6 batch 2"
            git push
          fi
