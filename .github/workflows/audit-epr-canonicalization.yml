name: Audit Extra Preliminary Canonicalization

on:
  push:
    branches:
      - audit/epr-canonicalization
    paths:
      - .github/workflows/audit-epr-canonicalization.yml
      - updater/audit_epr_authoritative_sources.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install --quiet pandas lxml
      - name: Audit authoritative EPR source pages
        run: python updater/audit_epr_authoritative_sources.py
      - name: Commit audit reports
        run: |
          git config user.name "Tin Foil FA Cup Audit"
          git config user.email "actions@users.noreply.github.com"
          git add epr-authoritative-source-audit.json epr-authoritative-source-audit.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Record Extra Preliminary source audit"
            git push
          fi
