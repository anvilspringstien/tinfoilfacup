name: Audit Extra Preliminary Canonicalization

on:
  push:
    branches:
      - audit/epr-canonicalization
    paths:
      - .github/workflows/audit-epr-canonicalization.yml
      - updater/audit_epr_authoritative_sources.py
      - updater/reconcile_epr_legacy_with_fwp.py
      - updater/build_epr_canonical_candidate.py
      - updater/audit_epr_runtime_path.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install --quiet pandas lxml
      - name: Audit Football Web Pages EPR source pages
        run: python updater/audit_epr_authoritative_sources.py
      - name: Reconcile legacy EPR table against dated source rows
        run: python updater/reconcile_epr_legacy_with_fwp.py
      - name: Build review-only canonical EPR candidate
        run: python updater/build_epr_canonical_candidate.py
      - name: Audit EPR runtime lookup path
        run: python updater/audit_epr_runtime_path.py
      - name: Commit audit reports
        run: |
          git config user.name "Tin Foil FA Cup Audit"
          git config user.email "actions@users.noreply.github.com"
          git add epr-authoritative-source-audit.json epr-authoritative-source-audit.md epr-legacy-reconciliation.md epr-canonical-candidate.json epr-canonical-candidate.md epr-runtime-path-audit.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Record Extra Preliminary canonical candidate"
            git push
          fi
