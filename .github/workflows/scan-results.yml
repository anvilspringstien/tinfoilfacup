name: Scan FA Cup results (v7.6 guarded)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Results source URL"
        required: true
        default: "https://www.thefa.com/competitions/thefacup/results"
      publish:
        description: "Publish validated new results?"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "updater/auto_results.py"
      - "updater/auto_round_results.py"
      - "updater/round_state_engine.py"
      - "updater/round_state_regression.py"
      - "updater/round_source_regression.py"
      - "updater/run_source_resilient.py"
      - "updater/sync_extra_preliminary_chronology.py"
      - "updater/extra_preliminary_replay_regression.py"
      - "updater/apply_replay_orientation_fix.py"
      - "updater/repair_first_qualifying_replays_20260909.py"
      - "updater/sync_second_qualifying_resolved.py"
      - "updater/sync_second_qualifying_stable.py"
      - "updater/active_draw_stability_regression.py"
      - "updater/conditional_resolution_regression.py"
      - "updater/reconcile_first_qualifying_replays.py"
      - "updater/replay_completion_guard.py"
      - "updater/reconcile_result_history_aliases.py"
      - "updater/enrich_later_round_venues.py"
      - "updater/enrich_replay_kickoffs_and_active_venues.py"
      - "updater/propagate_active_fixture_venues.py"
      - "updater/historical-match-venue-ledger.json"
      - "updater/propagate_historical_match_venues.py"
      - "updater/kickoff_venue_regression.py"
      - "updater/kt21_replay_regression.py"
      - "updater/kt21_venue_render_regression.js"
      - "updater/ex8_venue_render_regression.js"
      - "updater/refresh_clubfinder_embedded_snapshot.py"
      - "updater/embedded_snapshot_regression.py"
      - "updater/patch_clubfinder_replay_progression.py"
      - "updater/patch_clubfinder_journey_integrity.py"
      - "updater/patch_clubfinder_branding.py"
      - "updater/patch_clubfinder_historical_venues.py"
      - "updater/clubfinder_render_regression.js"
      - "updater/amersham_card_render_regression.js"
      - "updater/amersham_stats_regression.js"
      - "updater/replay_progression_regression.js"
      - "updater/historical_journey_regression.js"
      - "updater/historical_venue_regression.js"
      - "updater/patch_clubfinder_production_ui.py"
      - "updater/patch_clubfinder_campaign_identity.py"
      - "updater/clubfinder-campaign-identity.js"
      - "counter-config.json"
      - "updater/clubfinder-production-challenge-bridge.js"
      - "updater/pigeon-miles-roundel-data-uri.txt"
      - "updater/production_ui_regression.js"
      - "updater/patch_clubfinder_law2_origins.py"
      - "updater/law2-verified-location-ledger.json"
      - "updater/promote_verified_law2_locations.py"
      - "updater/audit_law2_location_verification.py"
      - "updater/law2_origin_regression.js"
      - "journey-club-registry.json"
      - ".github/workflows/scan-results.yml"
permissions:
  contents: write
concurrency:
  group: competition-state-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Scheduled runs can wait behind the shared concurrency lock. Re-resolve the branch
          # head when execution starts so a queued run does not build from a stale event SHA.
          ref: ${{ github.ref_name }}
      - name: Guard universal round-state chronology
        run: python updater/round_state_regression.py
      - name: Guard round-source disposition parsing
        run: python updater/round_source_regression.py
      - name: Synchronise complete Extra Preliminary chronology
        run: python updater/run_source_resilient.py --label "Extra Preliminary chronology sync" -- python updater/sync_extra_preliminary_chronology.py
      - name: Guard Extra Preliminary replay ancestry
        run: python updater/extra_preliminary_replay_regression.py
      - name: Apply guarded replay-orientation fix
        run: python updater/apply_replay_orientation_fix.py
      - name: Repair verified 9 September First Qualifying replays
        run: python updater/repair_first_qualifying_replays_20260909.py
      - name: Synchronise resolved Second Qualifying draw
        run: python updater/run_source_resilient.py --label "Resolved Second Qualifying sync" -- python updater/sync_second_qualifying_stable.py
      - name: Guard active draw stability
        run: python updater/active_draw_stability_regression.py
      - name: Guard conditional draw-slot resolution
        run: python updater/conditional_resolution_regression.py
      - name: Reconcile all First Qualifying replays
        run: python updater/reconcile_first_qualifying_replays.py
      - name: Scan active round and validate dispositions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          SOURCE_URL="${INPUT_SOURCE_URL:-https://www.thefa.com/competitions/thefacup/results}"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            python updater/run_source_resilient.py --label "FA Cup active-round result scan" -- python updater/auto_round_results.py --url "$SOURCE_URL" --publish
          else
            python updater/run_source_resilient.py --label "FA Cup active-round result scan" -- python updater/auto_round_results.py --url "$SOURCE_URL"
          fi
      - name: Reconcile replay-participant result-history aliases
        run: python updater/reconcile_result_history_aliases.py
      - name: Guard replay-participant result-history aliases
        run: python updater/reconcile_result_history_aliases.py --check
      - name: Guard complete First Qualifying replay coverage
        run: python updater/replay_completion_guard.py
      - name: Enrich later-round fixture venues
        run: python updater/enrich_later_round_venues.py
      - name: Enrich replay kick-offs and active fixture venues
        run: python updater/enrich_replay_kickoffs_and_active_venues.py
      - name: Propagate verified venues across active fixture copies
        run: python updater/propagate_active_fixture_venues.py
      - name: Propagate verified historical match venues
        run: python updater/propagate_historical_match_venues.py
      - name: Guard enriched replay kick-offs and active venues
        run: python updater/kickoff_venue_regression.py
      - name: Audit repaired competition chronology
        run: python updater/competition_health.py
      - name: Rebuild Clubfinder competition presentation
        run: |
          python updater/patch_clubfinder_competition_logic.py
          python updater/patch_clubfinder_replay_progression.py
          python updater/patch_clubfinder_journey_integrity.py
          python updater/patch_clubfinder_result_status.py
          python updater/patch_clubfinder_stats_integrity.py
          python updater/patch_clubfinder_branding.py
          python updater/patch_clubfinder_law2_origins.py
          python updater/promote_verified_law2_locations.py
          python updater/audit_law2_location_verification.py
          python updater/patch_clubfinder_historical_venues.py
          python updater/patch_clubfinder_production_ui.py
          python updater/patch_clubfinder_campaign_identity.py
          python updater/refresh_clubfinder_embedded_snapshot.py
      - name: Re-check replay-participant result-history aliases
        run: python updater/reconcile_result_history_aliases.py --check
      - name: Run competition regression guard
        run: python updater/competition_regression_guard.py
      - name: Run rendered Clubfinder regression
        run: node updater/clubfinder_render_regression.js
      - name: Run rendered HP7 Amersham card regression
        run: node updater/amersham_card_render_regression.js
      - name: Run HP7 Amersham Stats and Pigeon Miles regression
        run: node updater/amersham_stats_regression.js
      - name: Run rendered EX8 venue regression
        run: node updater/ex8_venue_render_regression.js
      - name: Run rendered KT21 venue regression
        run: node updater/kt21_venue_render_regression.js
      - name: Run Law 2 origin regression
        run: node updater/law2_origin_regression.js
      - name: Run systemic replay progression regression
        run: node updater/replay_progression_regression.js
      - name: Run KT21 replay regression
        run: python updater/kt21_replay_regression.py
      - name: Guard embedded fallback freshness
        run: python updater/embedded_snapshot_regression.py
      - name: Run Clubfinder Stats regression
        run: node updater/clubfinder_stats_regression.js
      - name: Run all-club journey integrity regression
        run: node updater/journey_integrity_regression.js
      - name: Run historical Campaign regression
        run: node updater/historical_journey_regression.js
      - name: Run generic historical venue regression
        run: node updater/historical_venue_regression.js
      - name: Run protected production UI regression
        run: node updater/production_ui_regression.js
      - name: Guard production presentation patch idempotency
        run: |
          python updater/patch_clubfinder_branding.py
          python updater/patch_clubfinder_production_ui.py
          python updater/patch_clubfinder_campaign_identity.py
          node updater/production_ui_regression.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-pilot-report
          path: updater/results-pilot-report.json
      - name: Commit validated competition data and Clubfinder
        if: ${{ github.ref_name == 'main' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish) }}
        run: |
          git config user.name "Tin Foil FA Cup Updater"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json clubfinder.html competition-health.md updater/competition-health.json law2-location-verification-audit.md updater/law2-location-verification-audit.json updater/auto_results.py updater/patch_clubfinder_competition_logic.py updater/patch_clubfinder_replay_progression.py updater/clubfinder_render_regression.js updater/replay_progression_regression.js
          if git diff --cached --quiet; then
            echo "No new results or Clubfinder changes."
          else
            git commit -m "Resolve replay journeys in Clubfinder v7.6"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            echo "Re-running critical publish guards after rebase..."
            python updater/reconcile_result_history_aliases.py --check
            python updater/extra_preliminary_replay_regression.py
            node updater/amersham_card_render_regression.js
            node updater/amersham_stats_regression.js
            node updater/historical_journey_regression.js
            node updater/journey_integrity_regression.js
            node updater/production_ui_regression.js
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi