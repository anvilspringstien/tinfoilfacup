name: Scan FA Cup results (v7.5 pilot)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Results source URL"
        required: true
        default: "https://www.thefa.com/competitions/thefacup/results"
      publish:
        description: "Publish validated new results?"
        required: true
        type: boolean
        default: false
  schedule:
    # Check hourly. auto_results.py only publishes unambiguous results that
    # are actually present on the FA results page; repeated runs are idempotent.
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan and validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          SOURCE_URL="${INPUT_SOURCE_URL:-https://www.thefa.com/competitions/thefacup/results}"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            python updater/auto_results.py --url "$SOURCE_URL" --publish
          else
            python updater/auto_results.py --url "$SOURCE_URL"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: results-pilot-report
          path: updater/results-pilot-report.json
      - name: Commit validated data
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          git config user.name "Tin Foil FA Cup Updater"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json
          if git diff --cached --quiet; then echo "No new results."; else git commit -m "Auto-import validated FA Cup results"; git push; fi
