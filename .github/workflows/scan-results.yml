name: Scan FA Cup results (v7.6 guarded)
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Results source URL"
        required: true
        default: "https://www.thefa.com/competitions/thefacup/results"
      publish:
        description: "Publish validated new results?"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "updater/auto_results.py"
      - "updater/run_source_resilient.py"
      - "updater/apply_replay_orientation_fix.py"
      - "updater/repair_first_qualifying_replays_20260909.py"
      - "updater/sync_second_qualifying_resolved.py"
      - "updater/reconcile_first_qualifying_replays.py"
      - "updater/replay_completion_guard.py"
      - "updater/enrich_later_round_venues.py"
      - "updater/enrich_replay_kickoffs_and_active_venues.py"
      - "updater/propagate_active_fixture_venues.py"
      - "updater/kickoff_venue_regression.py"
      - "updater/kt21_replay_regression.py"
      - "updater/kt21_venue_render_regression.js"
      - "updater/ex8_venue_render_regression.js"
      - "updater/refresh_clubfinder_embedded_snapshot.py"
      - "updater/embedded_snapshot_regression.py"
      - "updater/patch_clubfinder_replay_progression.py"
      - "updater/replay_progression_regression.js"
      - ".github/workflows/scan-results.yml"
permissions:
  contents: write
concurrency:
  group: competition-state-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Apply guarded replay-orientation fix
        run: python updater/apply_replay_orientation_fix.py
      - name: Repair verified 9 September First Qualifying replays
        run: python updater/repair_first_qualifying_replays_20260909.py
      - name: Synchronise resolved Second Qualifying draw
        run: python updater/run_source_resilient.py --label "Resolved Second Qualifying sync" -- python updater/sync_second_qualifying_resolved.py
      - name: Reconcile all First Qualifying replays
        run: python updater/reconcile_first_qualifying_replays.py
      - name: Guard complete First Qualifying replay coverage
        run: python updater/replay_completion_guard.py
      - name: Scan and validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          SOURCE_URL="${INPUT_SOURCE_URL:-https://www.thefa.com/competitions/thefacup/results}"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            python updater/run_source_resilient.py --label "FA Cup result scan" -- python updater/auto_results.py --url "$SOURCE_URL" --publish
          else
            python updater/run_source_resilient.py --label "FA Cup result scan" -- python updater/auto_results.py --url "$SOURCE_URL"
          fi
      - name: Enrich later-round fixture venues
        run: python updater/enrich_later_round_venues.py
      - name: Enrich replay kick-offs and active fixture venues
        run: python updater/enrich_replay_kickoffs_and_active_venues.py
      - name: Propagate verified venues across active fixture copies
        run: python updater/propagate_active_fixture_venues.py
      - name: Guard enriched replay kick-offs and active venues
        run: python updater/kickoff_venue_regression.py
      - name: Audit repaired competition chronology
        run: python updater/competition_health.py
      - name: Rebuild Clubfinder competition presentation
        run: |
          python updater/patch_clubfinder_competition_logic.py
          python updater/patch_clubfinder_replay_progression.py
          python updater/patch_clubfinder_journey_integrity.py
          python updater/patch_clubfinder_result_status.py
          python updater/patch_clubfinder_stats_integrity.py
          python updater/patch_clubfinder_branding.py
          python updater/refresh_clubfinder_embedded_snapshot.py
      - name: Run competition regression guard
        run: python updater/competition_regression_guard.py
      - name: Run rendered Clubfinder regression
        run: node updater/clubfinder_render_regression.js
      - name: Run rendered EX8 venue regression
        run: node updater/ex8_venue_render_regression.js
      - name: Run rendered KT21 venue regression
        run: node updater/kt21_venue_render_regression.js
      - name: Run systemic replay progression regression
        run: node updater/replay_progression_regression.js
      - name: Run KT21 replay regression
        run: python updater/kt21_replay_regression.py
      - name: Guard embedded fallback freshness
        run: python updater/embedded_snapshot_regression.py
      - name: Run Clubfinder Stats regression
        run: node updater/clubfinder_stats_regression.js
      - name: Run all-club journey integrity regression
        run: node updater/journey_integrity_regression.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-pilot-report
          path: updater/results-pilot-report.json
      - name: Commit validated competition data and Clubfinder
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish }}
        run: |
          git config user.name "Tin Foil FA Cup Updater"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json clubfinder.html competition-health.md updater/competition-health.json updater/auto_results.py updater/patch_clubfinder_competition_logic.py updater/patch_clubfinder_replay_progression.py updater/clubfinder_render_regression.js updater/replay_progression_regression.js
          if git diff --cached --quiet; then
            echo "No new results or Clubfinder changes."
          else
            git commit -m "Resolve replay journeys in Clubfinder v7.6"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
