name: Tester postcode export
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/export_test_postcodes.py'
      - 'updater/patch_clubfinder_law2_origins.py'
      - '.github/workflows/tester-postcode-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Law 2 origin view
        run: python updater/patch_clubfinder_law2_origins.py
      - name: Export Law 2 club postcodes
        run: python updater/export_test_postcodes.py
      - name: Commit tester list
        if: ${{ github.ref_name == 'main' }}
        run: |
          git config user.name "Tin Foil FA Cup Tester Export"
          git config user.email "actions@users.noreply.github.com"
          git add tester-club-postcodes.csv
          if git diff --cached --quiet; then
            echo "Tester list unchanged."
          else
            git commit -m "Update tester club postcode list"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tester-club-postcodes
          path: tester-club-postcodes.csv
