name: Tester postcode export
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/export_test_postcodes.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Export verified club postcodes
        run: python updater/export_test_postcodes.py
      - name: Commit tester list
        run: |
          git config user.name "Tin Foil FA Cup Tester Export"
          git config user.email "actions@users.noreply.github.com"
          git add tester-club-postcodes.csv
          if git diff --cached --quiet; then
            echo "Tester list unchanged."
          else
            git commit -m "Update tester club postcode list"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tester-club-postcodes
          path: tester-club-postcodes.csv
