name: Shared phone frame Shed
on:
  pull_request:
    paths:
      - 'beta/club-details*'
      - 'beta/barry-air/**'
      - 'beta/clubfinder-beta.html'
      - 'updater/build_barry_air_adapter.py'
      - 'tests/barry-air-*'
      - 'tests/club-details-*'
      - 'updater/build_club_campaign_engine.py'
      - 'index.html'
      - 'beta/phone-frame.html'
      - 'beta/phone-frame-launch.js'
      - 'beta/keep-the-magic-shed.html'
      - 'beta/phone-frame-shed.*'
      - 'beta/phone-frame-navigation.js'
      - 'tests/phone-frame-shed-browser.mjs'
      - '.github/workflows/phone-frame-shed.yml'
  workflow_dispatch:
jobs:
  shared-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check beta/phone-frame-shed.js
      - run: node --check beta/phone-frame-navigation.js
      - run: node tests/beta-approved-journey-lock.mjs
      - run: node tests/keep-the-magic-regression.js
      - run: node tests/keep-magic-install-regression.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: python3 updater/build_barry_air_adapter.py --check
      - run: node tests/barry-air-model.mjs
      - run: node tests/barry-air-browser.mjs
      - run: node tests/phone-frame-shed-browser.mjs
      - run: python3 updater/build_club_campaign_engine.py --check
      - run: node tests/club-details-campaigns.mjs
      - run: node tests/club-details-model.mjs
      - run: node tests/club-details-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-phone-frame-evidence
          path: phone-frame-evidence/
