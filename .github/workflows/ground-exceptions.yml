name: Ground exception resolver (v7.6.7)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Triage remaining ground exceptions
        run: python updater/ground_exception_resolver.py
      - name: Commit exception dashboard
        run: |
          git config user.name "Tin Foil FA Cup Ground Exceptions"
          git config user.email "actions@users.noreply.github.com"
          git add ground-exceptions.md updater/ground-exceptions.json
          if git diff --cached --quiet; then echo "Ground exceptions unchanged."; else git commit -m "Update ground exception dashboard"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ground-exceptions
          path: |
            ground-exceptions.md
            updater/ground-exceptions.json
