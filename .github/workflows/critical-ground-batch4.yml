name: Critical ground batch 4 (v7.9.9)
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/publish_critical_ground_batch4.py'
      - '.github/workflows/critical-ground-batch4.yml'
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote seven independently validated critical ground records
        run: python updater/publish_critical_ground_batch4.py
      - name: Re-run Ground Health
        run: python updater/ground_health.py
      - name: Commit batch and Ground Health
        run: |
          git config user.name "Tin Foil FA Cup Ground Research"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html critical-ground-batch4.md updater/critical-ground-batch4.json ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Publish critical ground batch 4 v7.9.9"; git push; fi
