name: Clubfinder Counter Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'counter-worker/**'
      - 'counter-config.json'
      - '.github/workflows/clubfinder-counter-check.yml'
  push:
    paths:
      - 'counter-worker/**'
      - 'counter-config.json'
      - '.github/workflows/clubfinder-counter-check.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Wrangler dry run
        run: npm run check

      - name: Probe deployed Worker health
        run: |
          curl --fail --silent --show-error \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/health

      - name: Probe deployed Worker contract
        run: |
          body="$(curl --fail --silent --show-error \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/contract)"
          echo "$body"
          echo "$body" | grep -q '"contract_version":2'
          echo "$body" | grep -q '"increment_response":"number"'

      - name: Guard both official origins in Worker configuration
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const origins=config.vars.ALLOWED_ORIGINS.split(',').map(x=>x.trim());
          assert.deepEqual(origins,[
            'https://anvilspringstien.github.io',
            'https://tinfoilfacup.com'
          ]);
          assert.equal(new Set(origins).size,origins.length);
          assert.equal(config.vars.COUNTER_SEED,'1000');
          assert.equal(config.durable_objects.bindings[0].name,'CLUBFINDER_COUNTER');
          console.log('Both exact website origins allowed; counter identity and seed unchanged.');
          NODE

      - name: Probe GitHub Pages CORS permission
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error \
            -X OPTIONS \
            -H 'Origin: https://anvilspringstien.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -D "$headers" \
            -o /dev/null \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/increment
          grep -qi '^access-control-allow-origin: https://anvilspringstien.github.io' "$headers"
          grep -qi '^access-control-allow-methods: .*POST' "$headers"

      # This live check must be run AFTER deploying the updated Worker.
      # Never make the pre-deployment PR fail for the expected old allowlist.
      - name: Probe new custom-domain CORS permission after deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error \
            -X OPTIONS \
            -H 'Origin: https://tinfoilfacup.com' \
            -H 'Access-Control-Request-Method: POST' \
            -D "$headers" \
            -o /dev/null \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/increment
          grep -qi '^access-control-allow-origin: https://tinfoilfacup.com' "$headers"
          grep -qi '^access-control-allow-methods: .*POST' "$headers"
