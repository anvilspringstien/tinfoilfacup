name: Clubfinder Counter Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'counter-worker/**'
      - '.github/workflows/clubfinder-counter-check.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: counter-worker/package-lock.json

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Wrangler dry run
        run: npm run check
