name: Clubfinder Counter Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'counter-worker/**'
      - 'counter-config.json'
      - '.github/workflows/clubfinder-counter-check.yml'
  push:
    paths:
      - 'counter-worker/**'
      - 'counter-config.json'
      - '.github/workflows/clubfinder-counter-check.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Wrangler dry run
        run: npm run check

      - name: Probe deployed Worker health
        run: |
          curl --fail --silent --show-error \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/health

      - name: Probe GitHub Pages CORS permission
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error \
            -X OPTIONS \
            -H 'Origin: https://anvilspringstien.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -D "$headers" \
            -o /dev/null \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/increment
          grep -qi '^access-control-allow-origin: https://anvilspringstien.github.io' "$headers"
          grep -qi '^access-control-allow-methods: .*POST' "$headers"
