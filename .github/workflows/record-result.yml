name: Record FA Cup result
on:
  workflow_dispatch:
    inputs:
      home: {description: "Home club", required: true}
      away: {description: "Away club", required: true}
      home_score: {description: "Home score", required: true}
      away_score: {description: "Away score", required: true}
      round_name: {description: "Round name", required: true, default: "Preliminary Round Replay"}
      match_date: {description: "Match date YYYY-MM-DD", required: true, default: "2026-08-25"}
      source_url: {description: "Reliable result source URL", required: true, default: "https://www.thefa.com/competitions/thefacup/results"}
      decision: {description: "Optional decision", required: false, default: ""}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record result
        run: |
          python updater/update_result.py "${{ inputs.home }}" "${{ inputs.away }}" "${{ inputs.home_score }}" "${{ inputs.away_score }}" "${{ inputs.round_name }}" "${{ inputs.match_date }}" "${{ inputs.source_url }}" "${{ inputs.decision }}"
      - name: Commit competition data
        run: |
          git config user.name "Tin Foil FA Cup Updater"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json
          if git diff --cached --quiet; then echo "No competition-data change."; else git commit -m "Record FA Cup result"; git push; fi
