name: Ground health monitor (v7.7.2)
on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python updater/ground_health.py
      - run: |
          git config user.name "Tin Foil FA Cup Ground Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update ground health"; git push; fi
