name: Ground health monitor (v7.6.2a)
on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python updater/ground_health.py
      - run: |
          git config user.name "Tin Foil FA Cup Ground Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then echo "Ground health report unchanged."; else git commit -m "Update ground health report"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ground-health
          path: |
            ground-health.md
            updater/ground-health.json
