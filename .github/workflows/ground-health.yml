name: Ground health monitor (v7.10.1)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"
    - cron: "37 19 * * *"
  push:
    paths:
      - 'clubfinder.html'
      - 'updater/ground-approval-ledger.json'
      - 'updater/ground_health.py'
      - 'updater/patch_clubfinder_law2_origins.py'
      - 'updater/law2-verified-location-ledger.json'
      - 'updater/promote_verified_law2_locations.py'
      - 'updater/audit_law2_location_verification.py'
      - 'updater/export_test_postcodes.py'
      - '.github/workflows/ground-health.yml'

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Law 2 origin view
        run: python updater/patch_clubfinder_law2_origins.py

      - name: Promote independently verified Law 2 locations
        run: python updater/promote_verified_law2_locations.py

      - name: Audit Law 2 verification queue
        run: python updater/audit_law2_location_verification.py

      - name: Audit canonical and Law 2 ground coverage
        run: python updater/ground_health.py

      - name: Validate Ground Health baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('updater/ground-health.json').read_text())
          c=d['counts']
          problems=[]
          if c.get('eligible_clubs') != 651: problems.append(f"eligible origin population {c.get('eligible_clubs')}/651")
          if c.get('selectable_location_coverage') != c.get('eligible_clubs'): problems.append(f"selectable location coverage {c.get('selectable_location_coverage')}/{c.get('eligible_clubs')}")
          if c.get('critical_items') != 0: problems.append(f"critical items {c.get('critical_items')}")
          if c.get('review_items') != 0: problems.append(f"review items {c.get('review_items')}")
          if c.get('approved_groundshares_pending_canonical_reconciliation') != 0: problems.append(f"pending groundshare reconciliations {c.get('approved_groundshares_pending_canonical_reconciliation')}")
          if c.get('unverified') != 0: problems.append(f"unverified canonical records {c.get('unverified')}")
          if c.get('law2_verified_supplemental',0) < 2: problems.append(f"verified Law 2 supplemental locations {c.get('law2_verified_supplemental',0)}/2")
          print('GROUND HEALTH BASELINE', c)
          if problems: raise SystemExit('Ground Health drift detected: ' + '; '.join(problems))
          PY

      - name: Export tester postcode list
        run: python updater/export_test_postcodes.py

      - name: Commit health report and tester list
        if: ${{ github.ref_name == 'main' }}
        run: |
          git config user.name "Tin Foil FA Cup Ground Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add ground-health.md updater/ground-health.json law2-location-verification-audit.md updater/law2-location-verification-audit.json tester-club-postcodes.csv
          if git diff --cached --quiet; then
            echo "Ground Health outputs unchanged."
          else
            git commit -m "Update Ground Health outputs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Ground Health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-health
          path: |
            ground-health.md
            updater/ground-health.json
            law2-location-verification-audit.md
            updater/law2-location-verification-audit.json
            tester-club-postcodes.csv
