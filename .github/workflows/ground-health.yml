name: Ground health monitor (v7.9.18)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"
    - cron: "37 19 * * *"
  push:
    paths:
      - 'clubfinder.html'
      - 'updater/ground-approval-ledger.json'
      - 'updater/ground_health.py'
      - '.github/workflows/ground-health.yml'

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Audit canonical ground coverage and shared venues
        run: python updater/ground_health.py

      - name: Validate Ground Health baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('updater/ground-health.json').read_text())
          c=d['counts']
          problems=[]
          if c.get('complete_verified') != c.get('eligible_clubs'):
              problems.append(f"verified coverage {c.get('complete_verified')}/{c.get('eligible_clubs')}")
          if c.get('critical_items') != 0:
              problems.append(f"critical items {c.get('critical_items')}")
          if c.get('review_items') != 0:
              problems.append(f"review items {c.get('review_items')}")
          if c.get('approved_groundshares_pending_canonical_reconciliation') != 0:
              problems.append(f"pending groundshare reconciliations {c.get('approved_groundshares_pending_canonical_reconciliation')}")
          if c.get('unverified') != 0:
              problems.append(f"unverified records {c.get('unverified')}")
          print('GROUND HEALTH BASELINE', c)
          if problems:
              raise SystemExit('Ground Health drift detected: ' + '; '.join(problems))
          PY

      - name: Commit health report
        if: always()
        run: |
          git config user.name "Tin Foil FA Cup Ground Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then
            echo "Ground Health report unchanged."
          else
            git commit -m "Update Ground Health report"
            git push
          fi

      - name: Upload Ground Health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-health
          path: |
            ground-health.md
            updater/ground-health.json
