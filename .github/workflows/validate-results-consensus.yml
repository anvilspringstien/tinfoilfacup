name: Validate results consensus (v7.5.5)
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cross-check known FA Cup ties
        run: python updater/multi_source_validator.py
      - uses: actions/upload-artifact@v4
        with:
          name: multi-source-validator-report
          path: updater/multi-source-validator-report.json
