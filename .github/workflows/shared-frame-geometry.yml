name: Shared frame geometry (Shed)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'beta/clubfinder-beta.html'
      - 'tests/shared-frame-geometry.mjs'
      - '.github/workflows/shared-frame-geometry.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tffc-http.log 2>&1 &
          echo $! > /tmp/tffc-http.pid
      - run: node tests/shared-frame-geometry.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-frame-geometry-evidence
          path: geometry-evidence/
          if-no-files-found: ignore
