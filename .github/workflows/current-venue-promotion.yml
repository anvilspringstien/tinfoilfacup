name: Current venue promotion (v7.9.3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/publish_current_venue_promotions.py'
      - '.github/workflows/current-venue-promotion.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish validated missing canonical venue records
        run: python updater/publish_current_venue_promotions.py
      - name: Re-run ground health after promotion
        run: python updater/ground_health.py
      - name: Commit venue promotion and ground health
        run: |
          git config user.name "Tin Foil FA Cup Ground Research"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html updater/ground-approval-ledger.json current-venue-promotion.md updater/current-venue-promotion.json ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Publish current venue promotions v7.9.3"
            git push
          fi
