name: BETA Weston diagnostic (isolated)
on:
  push:
    branches: ['beta/weston-replay-stats-20260924']
    paths:
      - 'updater/diagnose_beta_weston.py'
      - '.github/workflows/beta-weston-diagnostic.yml'
      - 'beta/clubfinder-beta.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show focused BETA replay and Stats source excerpts
        run: python updater/diagnose_beta_weston.py
