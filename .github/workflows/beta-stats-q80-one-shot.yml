name: One-shot BETA Stats q80 WebP build
on:
  push:
    branches: [perf/beta-stats-q80-webp]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: perf/beta-stats-q80-webp }
      - run: python -m pip install pillow
      - name: Convert full-resolution Stats roundels and patch references
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          root=Path('.')
          d=root/'beta/assets/stats-report'
          mapping={
            'rounds-completed-b2fef60a225c.png':'rounds-completed-q80.webp',
            'matches-played-298ff9e75570.png':'matches-played-q80.webp',
            'clubs-encountered-ef3c16d79856.png':'clubs-encountered-q80.webp',
            'goals-seen-7de1249b67bf.png':'goals-seen-q80.webp',
            'grounds-visited-6848e3eb51f9.png':'grounds-visited-q80.webp',
            'pigeon-miles-flown-143c833d4cdf.png':'pigeon-miles-flown-q80.webp',
          }
          total_old=total_new=0
          for old,new in mapping.items():
            src=d/old; dst=d/new
            im=Image.open(src).convert('RGBA')
            size=im.size
            im.save(dst,'WEBP',quality=80,method=6)
            check=Image.open(dst)
            assert check.size==size, (old,size,check.size)
            total_old+=src.stat().st_size; total_new+=dst.stat().st_size
            print(f'{old}: {size[0]}x{size[1]} {src.stat().st_size} -> {dst.stat().st_size}')
          print(f'TOTAL: {total_old} -> {total_new} ({(1-total_new/total_old)*100:.1f}% reduction)')
          p=root/'beta/clubfinder-beta.html'
          s=p.read_text()
          for old,new in mapping.items():
            s=s.replace('assets/stats-report/'+old,'assets/stats-report/'+new)
          p.write_text(s)
          # Update dedicated artwork regression while preserving one PNG header.
          p=root/'tests/test_beta_stats_artwork_preload.js'
          s=p.read_text()
          for old,new in mapping.items():
            s=s.replace('assets/stats-report/'+old,'assets/stats-report/'+new)
          s=s.replace("const reportImages=[...html.matchAll(/assets\\/stats-report\\/[^\"'\\\\]+\\.png/g)].map(m=>m[0]);",
                      "const reportImages=[...html.matchAll(/assets\\/stats-report\\/[^\"'\\\\]+\\.(?:png|webp)/g)].map(m=>m[0]);")
          p.write_text(s)
          # Update shared identity regression: seven external report images may be PNG/WebP.
          p=root/'updater/beta_campaign_identity_regression.js'
          s=p.read_text()
          s=s.replace("const reportImages=[...html.matchAll(/assets\\/stats-report\\/[a-z0-9-]+[.]png/g)].map(m=>m[0]);",
                      "const reportImages=[...html.matchAll(/assets\\/stats-report\\/[a-z0-9-]+[.](?:png|webp)/g)].map(m=>m[0]);")
          old="""for(const url of reportImages){
            const bytes=fs.readFileSync(path.join(ROOT,'beta',url));
            if(!bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))
              throw new Error('BETA Stats: missing or invalid report image '+url);
          }"""
          new="""for(const url of reportImages){
            const bytes=fs.readFileSync(path.join(ROOT,'beta',url));
            const png=bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]));
            const webp=bytes.subarray(0,4).toString()==='RIFF'&&bytes.subarray(8,12).toString()==='WEBP';
            if(!png&&!webp)throw new Error('BETA Stats: missing or invalid report image '+url);
          }"""
          s=s.replace(old,new)
          s=s.replace("""const urls=[...page.matchAll(new RegExp('<img[^>]+src="(assets/stats-report/[a-z0-9-]+[.]png)"','g'))].map(m=>m[1]);""",
                      """const urls=[...page.matchAll(new RegExp('<img[^>]+src="(assets/stats-report/[a-z0-9-]+[.](?:png|webp))"','g'))].map(m=>m[1]);""")
          p.write_text(s)
          PY
      - name: Remove one-shot builder and commit generated result
        run: |
          rm .github/workflows/beta-stats-q80-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/clubfinder-beta.html beta/assets/stats-report tests/test_beta_stats_artwork_preload.js updater/beta_campaign_identity_regression.js .github/workflows/beta-stats-q80-one-shot.yml
          git commit -m "BETA: serve full-resolution q80 WebP Stats roundels"
          git push origin HEAD:perf/beta-stats-q80-webp
