          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          root = Path('beta/assets/challenge-mats')
          expected = {}
          for line in Path('/tmp/expected.tsv').read_text().splitlines():
              if not line.strip():
                  continue
              name, size, sha = line.strip().split()
              expected[name] = (int(size), sha)

          files = sorted(root.glob('mat-*.webp'))
          assert len(files) == 56, f'Expected 56 mats, found {len(files)}'
          assert set(p.name for p in files) == set(expected), 'Filename set differs from tested 640 baseline'

          for p in files:
              with Image.open(p) as im:
                  out = im.resize((640, 640), Image.Resampling.LANCZOS)
                  out.save(p, 'WEBP', quality=90, method=6)

          total = 0
          mismatches = []
          for p in files:
              with Image.open(p) as im:
                  if im.size != (640, 640):
                      mismatches.append(f'{p.name}: dimensions {im.size}')
              data = p.read_bytes()
              total += len(data)
              want_size, want_sha = expected[p.name]
              got_sha = hashlib.sha256(data).hexdigest()
              if len(data) != want_size or got_sha != want_sha:
                  mismatches.append(f'{p.name}: size {len(data)}/{want_size}, sha {got_sha}/{want_sha}')

          assert total == 9773150, f'Total mat bytes {total}, expected 9773150'
          assert not mismatches, '\n'.join(mismatches)
          print(f'VERIFIED: 56 exact 640x640 baseline mats, {total} bytes')
          PY
      - name: Commit 640 baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/assets/challenge-mats/*.webp
          git diff --cached --stat
          git commit -m "Replace Challenge Mats with 640px baseline"
          git push
