name: One-shot bank approved BETA Stats q80 logo
on:
  push:
    branches: [perf/beta-stats-q80-webp]
permissions:
  contents: write
jobs:
  bank:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch BETA Stats logo reference
        run: |
          python - <<'PY'
          from pathlib import Path
          old='header-logo-f533fc07b55f.png'
          new='header-logo-q80.webp'
          files=[
            Path('beta/clubfinder-beta.html'),
            Path('tests/test_beta_stats_artwork_preload.js'),
            Path('updater/beta_campaign_identity_regression.js'),
          ]
          total=0
          for p in files:
            s=p.read_text()
            n=s.count(old)
            if n:
              p.write_text(s.replace(old,new))
              print(f'{p}: {n} replacement(s)')
              total += n
          if total == 0:
            raise SystemExit('No header-logo references replaced')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/beta-stats-logo-bank-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/clubfinder-beta.html tests/test_beta_stats_artwork_preload.js updater/beta_campaign_identity_regression.js .github/workflows/beta-stats-logo-bank-one-shot.yml
          git commit -m "BETA: serve approved q80 WebP Stats header logo"
          git push
