name: Refresh PR 228 BETA generated guards
on:
  push:
    branches:
      - beta/canonical-first-loader-20261008
    paths:
      - '.github/workflows/beta-pr228-generated-guards.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/beta-pr228-generated-guards.yml'
permissions:
  contents: write
jobs:
  regenerate-beta-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta/canonical-first-loader-20261008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/canonical-first-loader-20261008
          fetch-depth: 0
      - name: Regenerate BETA snapshot and exact Stage C audit
        run: |
          set -euo pipefail
          python3 updater/refresh_beta_embedded_snapshot.py
          python3 updater/audit_beta_clubfinder_stage_c.py
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 updater/audit_beta_clubfinder_stage_c.py --check
          python3 -m unittest discover -s tests -p 'test_beta_embedded_snapshot_refresh.py' -v
          node updater/beta_competition_loader_regression.js
          node tests/test_beta_weston_replay_stats.js
      - name: Verify generated changes confined to BETA assets and report
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(beta/competition-fallback.json|docs/refactor/2026-09-25-stage-c-clubfinder-producer-map.md)$' /tmp/changed.txt; then
            echo 'Unexpected generated file change'; exit 1
          fi
          test -s /tmp/changed.txt
          git diff --exit-code -- competition.json clubfinder.html
      - name: Commit generated BETA-only artifacts to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- beta/competition-fallback.json docs/refactor/2026-09-25-stage-c-clubfinder-producer-map.md
          git commit -m 'Refresh BETA fallback and Stage C report from canonical source'
          git push origin HEAD:beta/canonical-first-loader-20261008
