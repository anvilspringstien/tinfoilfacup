name: One-time BETA iPhone Stats two-line correction
on:
  push:
    branches: ['fix/beta-stats-iphone-two-line-identity-20260925']
    paths:
      - 'updater/patch_beta_stats_two_line_one_time.py'
      - '.github/workflows/one-time-beta-stats-two-line.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact accepted BETA source and trusted main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          test "$(git hash-object beta/clubfinder-beta.html)" = "0fe6cb4fc8d06c85c9236fff6569ac0f07270961" || { echo "ABORT: BETA source advanced"; exit 1; }
      - name: Apply guarded CSS and HTML grouping with reverse-patch check
        run: |
          set -euo pipefail
          python3 updater/patch_beta_stats_two_line_one_time.py
          python3 updater/patch_beta_stats_two_line_one_time.py --check
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 updater/patch_beta_mobile_pigeon_name.py --check
          node --check updater/beta_campaign_identity_regression.js
      - name: Verify Campaign, Deck, Trophy and mobile identity
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Verify historical venues and replay safeguards
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Prevent production/competition changes or branch drift
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          git diff --exit-code origin/main...HEAD -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --exit-code -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --check
          test "$(git diff --name-only)" = "beta/clubfinder-beta.html" || { echo "ABORT: unrelated tracked file changed"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { echo "ABORT: untracked output"; exit 1; }
      - name: Commit only guarded BETA HTML
        if: github.ref == 'refs/heads/fix/beta-stats-iphone-two-line-identity-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup Mobile QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          test "$(git diff --cached --name-only)" = "beta/clubfinder-beta.html"
          git commit -m "fix(beta): keep iPhone Stats pigeon name label and value together"
          git push origin HEAD:fix/beta-stats-iphone-two-line-identity-20260925
