name: Ground coordinate repair probe (v7.6.3)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve missing coordinates from known postcodes
        run: python updater/ground_coordinate_repair.py
      - name: Commit repair proposal
        run: |
          git config user.name "Tin Foil FA Cup Ground Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add ground-coordinate-repair.md updater/ground-coordinate-repair.json
          if git diff --cached --quiet; then echo "Proposal unchanged."; else git commit -m "Update ground coordinate repair proposal"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ground-coordinate-repair
          path: |
            ground-coordinate-repair.md
            updater/ground-coordinate-repair.json
