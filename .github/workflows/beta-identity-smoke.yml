name: Clubfinder BETA identity smoke

on:
  pull_request:
    paths:
      - 'beta/clubfinder-beta.html'
      - 'beta/competition-fallback.json'
      - 'tests/test_beta_verified_conditional_replay.js'
      - 'tests/test_beta_thame_next_fixture.js'
      - 'tests/test_beta_conditional_draw_alias.js'
      - 'tests/test_beta_holmesdale_campaign.js'
      - 'tests/test_beta_gloucester_current_identity.js'
      - 'tests/test_beta_weston_replay_stats.js'
      - 'updater/refresh_beta_embedded_snapshot.py'
      - 'tests/test_beta_embedded_snapshot_refresh.py'
      - 'tests/test_beta_competition_loader.js'
      - 'tests/test_beta_first_keystroke_prefetch.js'
      - '.github/workflows/beta-identity-smoke.yml'
  push:
    paths:
      - 'beta/clubfinder-beta.html'
      - 'beta/competition-fallback.json'
      - 'updater/beta_campaign_identity_regression.js'
      - 'tests/test_beta_verified_conditional_replay.js'
      - 'tests/test_beta_thame_next_fixture.js'
      - 'tests/test_beta_conditional_draw_alias.js'
      - 'tests/test_beta_holmesdale_campaign.js'
      - 'tests/test_beta_weston_replay_stats.js'
      - 'updater/refresh_beta_embedded_snapshot.py'
      - 'tests/test_beta_embedded_snapshot_refresh.py'
      - 'tests/test_beta_first_keystroke_prefetch.js'
      - 'tests/test_beta_competition_loader.js'
      - '.github/workflows/beta-identity-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require BETA offline fallback to match canonical live competition data
        run: python updater/refresh_beta_embedded_snapshot.py --check
      - name: Prove Future Round canonical state reaches BETA fallback
        run: python -m unittest discover -s tests -p 'test_beta_embedded_snapshot_refresh.py' -v
      - name: Regress BETA counter, Pigeon and refresh persistence
        run: node updater/beta_campaign_identity_regression.js
      - name: Regress live competition, fallback and unavailable loading
        run: node tests/test_beta_competition_loader.js
      - name: Regress first-keystroke competition prefetch
        run: node tests/test_beta_first_keystroke_prefetch.js
      - name: Regress BETA verified replay and conditional draw resolution
        run: node tests/test_beta_verified_conditional_replay.js
      - name: Regress actual Thame next fixture and Exmouth fail-closed
        run: node tests/test_beta_thame_next_fixture.js
      - name: Regress Holmesdale merger journey, verified venues and Pigeon Miles
        run: node tests/test_beta_holmesdale_campaign.js
      - name: Regress Gloucester current identity, verified ground and GL1 canary
        run: node tests/test_beta_gloucester_current_identity.js
      - name: Regress other FA draw abbreviations against BETA
        run: node tests/test_beta_conditional_draw_alias.js
      - name: Regress BETA replay kick-off, shootout display and Stats accounting
        run: node tests/test_beta_weston_replay_stats.js
