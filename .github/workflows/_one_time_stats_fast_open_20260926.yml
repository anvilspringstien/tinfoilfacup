name: TEMP isolated BETA Stats first-open patch
on:
  push:
    branches: ['beta/stats-instant-reloadable-20260926']
    paths: ['.github/workflows/_one_time_stats_fast_open_20260926.yml']
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed on exact accepted source and regression baselines
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git hash-object beta/clubfinder-beta.html)" = "a545cacb976a81984c75b1d91beb65857fabf800" ]
          [ "$(git hash-object updater/beta_campaign_identity_regression.js)" = "0c2c86ea55fbc19d14d2608066719cc9f89e27b4" ]
          git diff --exit-code HEAD -- clubfinder.html competition.json beta/challenges-beta.html
      - name: Patch full-source BETA using pinned one-time source edits
        run: |
          set -euo pipefail
          python3 updater/_one_time_stats_fast_open_20260926.py
          node --check updater/beta_campaign_identity_regression.js
      - name: Exercise actual Clubfinder Stats, Deck, phone, and historical paths
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Verify exactly two tested application/test files changed
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --name-only | sort > /tmp/actual-stats-files
          printf '%s\n' beta/clubfinder-beta.html updater/beta_campaign_identity_regression.js | sort > /tmp/expected-stats-files
          diff -u /tmp/expected-stats-files /tmp/actual-stats-files
      - name: Commit only the tested change to isolated BETA branch
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup Stats BETA"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html updater/beta_campaign_identity_regression.js
          git commit -m "BETA: open Stats from loaded Clubfinder and retain reloadable report URL"
          git push origin HEAD:beta/stats-instant-reloadable-20260926
