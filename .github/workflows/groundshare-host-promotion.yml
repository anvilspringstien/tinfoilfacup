name: Groundshare host promotion (v7.9.5)
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/promote_groundshare_hosts.py'
      - '.github/workflows/groundshare-host-promotion.yml'
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote the two validated missing canonical host records
        run: python updater/promote_groundshare_hosts.py
      - name: Re-run Ground Health reconciliation
        run: python updater/ground_health.py
      - name: Commit host promotion and Ground Health
        run: |
          git config user.name "Tin Foil FA Cup Ground Research"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html groundshare-host-promotion.md updater/groundshare-host-promotion.json ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Promote canonical groundshare hosts v7.9.5"
            git push
          fi
