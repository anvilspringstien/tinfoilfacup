name: One-time guarded original BETA Stats viewport restoration
on:
  push:
    branches: ['fix/beta-stats-restore-original-viewport-20260925']
    paths:
      - 'updater/patch_beta_stats_viewport_one_time.py'
      - '.github/workflows/one-time-beta-stats-viewport-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard accepted BETA baseline and protected main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          test "$(git hash-object beta/clubfinder-beta.html)" = "6ee4432fdbb8df865638cfa041f1c86ad56f47d7" || { echo "ABORT: accepted BETA artifact changed"; exit 1; }
      - name: Patch original wide report and preserve normal iPhone Clubfinder
        run: |
          set -euo pipefail
          python3 updater/patch_beta_stats_viewport_one_time.py
          python3 updater/patch_beta_stats_viewport_one_time.py --check
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 updater/patch_beta_mobile_pigeon_name.py --check
          node --check updater/beta_campaign_identity_regression.js
      - name: Guard actual open/refresh, original wide report, Deck and Trophy
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Validate unchanged venue, custody and replay behaviour
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Fail closed on production, competition or other modified files
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          git diff --exit-code origin/main...HEAD -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --exit-code -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --check
          test "$(git diff --name-only)" = "beta/clubfinder-beta.html" || { echo "ABORT: unexpected tracked change"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { echo "ABORT: untracked artifact"; exit 1; }
      - name: Commit only validated BETA Stats viewport change
        if: github.ref == 'refs/heads/fix/beta-stats-restore-original-viewport-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup Mobile QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          test "$(git diff --cached --name-only)" = "beta/clubfinder-beta.html"
          git commit -m "fix(beta): preserve wide pinch-to-read Stats layout on refreshable route"
          git push origin HEAD:fix/beta-stats-restore-original-viewport-20260925
