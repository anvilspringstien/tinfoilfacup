name: Guarded production Thame fixture repair

on:
  push:
    branches: ['fix/production-thame-verified-fixture-20260924']
    paths:
      - 'updater/patch_production_thame_fixture.py'
      - 'tests/test_production_thame_next_fixture.js'
      - '.github/workflows/production-thame-fixture-guard.yml'
      - 'clubfinder.html'
  pull_request:
    paths:
      - 'clubfinder.html'
      - 'tests/test_production_thame_next_fixture.js'
      - '.github/workflows/production-thame-fixture-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guarded-production-thame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restrict patch automation to isolated repair branch
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "fix/production-thame-verified-fixture-20260924"
      - name: Apply idempotent fixture-local production patch
        run: python updater/patch_production_thame_fixture.py
      - name: Regress Thame success and Exmouth fail-closed
        run: node tests/test_production_thame_next_fixture.js
      - name: Existing rendered journey regression
        run: node updater/clubfinder_render_regression.js
      - name: Existing historical venue regression
        run: node updater/historical_venue_regression.js
      - name: Protect canonical data and BETA
        run: git diff --exit-code -- competition.json beta/clubfinder-beta.html
      - name: Commit branch-only production candidate
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- clubfinder.html; then
            echo "Production candidate already patched."
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^ M clubfinder.html$' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clubfinder.html
          git commit -m "fix(production): resolve verified Thame next fixture"
          git push origin HEAD:"$GITHUB_REF_NAME"
