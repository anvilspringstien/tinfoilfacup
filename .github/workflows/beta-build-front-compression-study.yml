name: BETA front compression study assets

on:
  push:
    branches:
      - beta/mat-compression-browser-study-20261001

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/mat-compression-browser-study-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build q85 and q80 640px fronts
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src_dir = Path("beta/assets/challenge-mats")
          original_total = 0
          totals = {85: 0, 80: 0}

          for i in range(28):
              cid = f"{i:02d}"
              src = src_dir / f"mat-{cid}-front.webp"
              original_total += src.stat().st_size
              with Image.open(src) as im:
                  assert im.size == (640, 640)
                  rgb = im.convert("RGB")
                  for q in (85, 80):
                      out_dir = Path(f"beta/assets/challenge-fronts-q{q}")
                      out_dir.mkdir(parents=True, exist_ok=True)
                      dest = out_dir / f"mat-{cid}-front.webp"
                      rgb.save(dest, "WEBP", quality=q, method=6)
                      with Image.open(dest) as check:
                          assert check.size == (640, 640)
                      totals[q] += dest.stat().st_size

          print("Original:", original_total)
          for q in (85, 80):
              print(f"q{q}:", totals[q], f"saving={(1-totals[q]/original_total)*100:.2f}%")
          PY

      - name: Verify sets
        run: |
          test "$(find beta/assets/challenge-fronts-q85 -name 'mat-*-front.webp' | wc -l)" -eq 28
          test "$(find beta/assets/challenge-fronts-q80 -name 'mat-*-front.webp' | wc -l)" -eq 28

      - name: Remove builder and commit
        run: |
          rm -f .github/workflows/beta-build-front-compression-study.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/assets/challenge-fronts-q85 beta/assets/challenge-fronts-q80 .github/workflows/beta-build-front-compression-study.yml
          git commit -m "BETA: add q85 and q80 640px front study assets"
          git push origin HEAD:beta/mat-compression-browser-study-20261001
