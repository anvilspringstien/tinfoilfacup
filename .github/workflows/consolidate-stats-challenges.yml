name: Consolidate Stats and Challenges

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/consolidate-stats-challenges.yml
      - updater/consolidate_stats_challenges.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Stats and Challenges consolidation
        run: python updater/consolidate_stats_challenges.py

      - name: Run Clubfinder render regression
        run: node updater/clubfinder_render_regression.js

      - name: Run Stats certificate regression
        run: node updater/clubfinder_stats_regression.js

      - name: Run journey integrity regression
        run: node updater/journey_integrity_regression.js

      - name: Commit consolidated UI
        run: |
          git config user.name "Tin Foil FA Cup UI"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html beta/challenges-beta.html
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "Consolidate Stats and Challenges navigation"
            git push
          fi
