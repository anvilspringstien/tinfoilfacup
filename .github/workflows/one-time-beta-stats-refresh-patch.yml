name: One-time guarded BETA Stats refresh route
on:
  push:
    branches: ['fix/beta-stats-pull-refresh-20260925']
    paths:
      - 'updater/patch_beta_stats_refresh_one_time.py'
      - '.github/workflows/one-time-beta-stats-refresh-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact BETA artifact and protected baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          test "$(git hash-object beta/clubfinder-beta.html)" = "cd2152931f9c13c434c82a54cbd1589fdf532e8b" || { echo "ABORT: BETA artifact drift"; exit 1; }
      - name: Apply and reverse-check reloadable route patch
        run: |
          set -euo pipefail
          python3 updater/patch_beta_stats_refresh_one_time.py
          python3 updater/patch_beta_stats_refresh_one_time.py --check
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 updater/patch_beta_mobile_pigeon_name.py --check
          node --check updater/beta_campaign_identity_regression.js
      - name: Exercise real Stats open, refresh, identity and whole Deck journey
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Preserve historical venues, conditional draws and replay protections
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Verify only the BETA artifact changed, not production
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "ABORT: main advanced"; exit 1; }
          git diff --exit-code origin/main...HEAD -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --exit-code -- clubfinder.html competition.json beta/challenges-beta.html
          git diff --check
          test "$(git diff --name-only)" = "beta/clubfinder-beta.html" || { echo "ABORT: unrelated file touched"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { echo "ABORT: untracked artifacts"; exit 1; }
      - name: Commit only validated BETA refresh-safe entry point
        if: github.ref == 'refs/heads/fix/beta-stats-pull-refresh-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup Mobile QA"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          test "$(git diff --cached --name-only)" = "beta/clubfinder-beta.html"
          git commit -m "fix(beta): launch Stats at existing reloadable route for iPhone refresh"
          git push origin HEAD:fix/beta-stats-pull-refresh-20260925
