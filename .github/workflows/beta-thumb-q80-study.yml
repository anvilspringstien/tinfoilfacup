name: BETA q80 Cabinet thumbnail study

on:
  push:
    branches:
      - beta/thumb-q80-study-20261001

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compare current q85 thumbs with regenerated q80
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          fronts=Path("beta/assets/challenge-mats")
          thumbs=Path("beta/assets/challenge-thumbs")
          out=Path("thumb-q80-study")
          out.mkdir(exist_ok=True)

          rows=[]
          current_total=0
          q80_total=0
          for i in range(1,28):
              cid=f"{i:02d}"
              current=thumbs/f"mat-{cid}-front.webp"
              src=fronts/f"mat-{cid}-front.webp"
              dest=out/f"mat-{cid}-front.webp"

              with Image.open(src) as im:
                  resized=im.convert("RGB").resize((200,200),Image.Resampling.LANCZOS)
                  resized.save(dest,"WEBP",quality=80,method=6)

              with Image.open(current) as cur:
                  assert cur.size==(200,200),(current,cur.size)
              with Image.open(dest) as chk:
                  assert chk.size==(200,200),(dest,chk.size)

              a=current.stat().st_size
              b=dest.stat().st_size
              current_total+=a
              q80_total+=b
              rows.append({"id":cid,"current_q85":a,"q80":b,"saving_pct":round((1-b/a)*100,2)})

          print("CURRENT_Q85_TOTAL",current_total)
          print("Q80_TOTAL",q80_total)
          print("SAVING_BYTES",current_total-q80_total)
          print("SAVING_PCT",round((1-q80_total/current_total)*100,2))
          print("AVG_CURRENT",round(current_total/27))
          print("AVG_Q80",round(q80_total/27))
          print("MIN_Q80",min(x["q80"] for x in rows))
          print("MAX_Q80",max(x["q80"] for x in rows))
          print(json.dumps(rows,indent=2))
          PY
