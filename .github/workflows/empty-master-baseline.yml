name: Empty master baseline diagnostic (Shed)
on:
  pull_request:
    paths:
      - 'tests/empty-master-baseline.mjs'
      - '.github/workflows/empty-master-baseline.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/empty-master-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empty-master-baseline-evidence
          path: splash-parity-evidence/
