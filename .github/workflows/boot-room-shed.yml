name: Boot Room Shed

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect-durable-object-namespaces:
    if: github.ref == 'refs/heads/ops/retired-boot-room-preview-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Durable Object namespace inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOOT_ROOM_PREVIEW_CLEANUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          saved = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          token_pattern = r"cfut_[A-Za-z0-9_-]{41,64}"
          if re.fullmatch(token_pattern, saved):
              token = saved
          else:
              matches = set(re.findall(r"Authorization:\s*Bearer\s+(" + token_pattern + r")(?=[\"'\s]|$)", saved))
              if len(matches) != 1:
                  raise SystemExit("BOOT_ROOM_PREVIEW_CLEANUP_TOKEN must contain one Cloudflare user API token.")
              token = matches.pop()

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not re.fullmatch(r"[0-9a-f]{32}", account_id):
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID must contain the 32-character account ID.")

          print(f"::add-mask::{token}", flush=True)
          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/workers/durable_objects/namespaces"
          )
          namespaces = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"{endpoint}?page={page}&per_page=1000",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Cloudflare namespace inventory returned HTTP {error.code}.") from None
              batch = payload.get("result")
              if not payload.get("success") or not isinstance(batch, list):
                  raise SystemExit("Cloudflare did not return a namespace inventory.")
              namespaces.extend(batch)
              total_pages = (payload.get("result_info") or {}).get("total_pages")
              if page >= (total_pages or 1):
                  break
              page += 1

          retired = "tffac-boot-room-shed_fix-boot-room-mobile-reconnect-20261103_BootRoom"
          print(f"Account namespace count: {len(namespaces)}")
          present = any(row.get("name") == retired for row in namespaces)
          print(f"Retired mobile reconnect namespace present: {'yes' if present else 'no'}")
          for worker, class_name in (("tffac-boot-room-shed", "BootRoom"), ("tffac-likes-shed", "TffacLikes")):
              print(f"{worker} namespace names and scripts:")
              for row in namespaces:
                  name = row.get("name") or ""
                  owner = row.get("script") or ""
                  if name.startswith(worker + "_") or (owner == worker and row.get("class") == class_name):
                      print("  " + json.dumps({"name": name, "script": owner}, ensure_ascii=True))
          PY
