name: Boot Room Shed

on:
  workflow_dispatch:

permissions: {}

jobs:
  remove-retired-preview:
    if: github.ref == 'refs/heads/ops/retired-boot-room-preview-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete the retired mobile reconnect Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOOT_ROOM_PREVIEW_CLEANUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set BOOT_ROOM_PREVIEW_CLEANUP_TOKEN in Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in Actions secrets}"
          npx --yes wrangler@4.156.1 preview delete \
            --worker-name tffac-boot-room-shed \
            --name 'fix/boot-room-mobile-reconnect-20261103' \
            --skip-confirmation
