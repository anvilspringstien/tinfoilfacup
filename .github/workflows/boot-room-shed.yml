name: Boot Room Shed

on:
  workflow_dispatch:

permissions: {}

jobs:
  remove-confirmed-retired-previews:
    if: github.ref == 'refs/heads/ops/retired-boot-room-preview-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove confirmed retired Previews and verify capacity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOOT_ROOM_PREVIEW_CLEANUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request

          saved = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          token_pattern = r"cfut_[A-Za-z0-9_-]{41,64}"
          if re.fullmatch(token_pattern, saved):
              token = saved
          else:
              matches = set(re.findall(r"Authorization:\s*Bearer\s+(" + token_pattern + r")(?=[\"'\s]|$)", saved))
              if len(matches) != 1:
                  raise SystemExit("BOOT_ROOM_PREVIEW_CLEANUP_TOKEN must contain one Cloudflare user API token.")
              token = matches.pop()

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not re.fullmatch(r"[0-9a-f]{32}", account_id):
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID must contain the 32-character account ID.")

          print(f"::add-mask::{token}", flush=True)
          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/workers/durable_objects/namespaces"
          )

          def read_namespaces():
              namespaces = []
              page = 1
              while True:
                  request = urllib.request.Request(
                      f"{endpoint}?page={page}&per_page=1000",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as error:
                      raise SystemExit(f"Cloudflare namespace inventory returned HTTP {error.code}.") from None
                  batch = payload.get("result")
                  if not payload.get("success") or not isinstance(batch, list):
                      raise SystemExit("Cloudflare did not return a namespace inventory.")
                  namespaces.extend(batch)
                  if page >= ((payload.get("result_info") or {}).get("total_pages") or 1):
                      return namespaces
                  page += 1


          retired_previews = (
              "audit/club-websites-batch19-20261107",
              "audit/club-websites-batch20-20261108",
              "fix/keep-refresh-scope-20261105",
              "fix/results-health-test-fixture-dates",
              "shed/keep-home-screen-icons",
              "ux/centre-refresh-control-20261105",
              "shed/keep-chrome-instructions",
          )
          targets = [
              (worker, preview, f"{worker}_{preview.replace('/', '-')}_{class_name}")
              for worker, class_name in (
                  ("tffac-boot-room-shed", "BootRoom"),
                  ("tffac-likes-shed", "TffacLikes"),
              )
              for preview in retired_previews
          ]

          before = read_namespaces()
          existing = {row.get("name") for row in before}
          print(f"Account namespace count before cleanup: {len(before)}", flush=True)
          os.environ["CLOUDFLARE_API_TOKEN"] = token
          os.environ["CLOUDFLARE_ACCOUNT_ID"] = account_id
          os.environ["WRANGLER_SEND_METRICS"] = "false"
          for worker, preview, namespace in targets:
              if namespace not in existing:
                  print(f"Skipping {worker} / {preview}: namespace already absent.", flush=True)
                  continue
              print(f"Removing retired Preview {worker} / {preview}", flush=True)
              result = subprocess.run([
                  "npx", "--yes", "wrangler@4.156.1", "preview", "delete",
                  "--worker-name", worker, "--name", preview, "--skip-confirmation",
              ])
              if result.returncode:
                  print(f"Wrangler failed for {worker} / {preview} (exit {result.returncode}).", flush=True)

          after = read_namespaces()
          remaining = {row.get("name") for row in after}
          removed = [name for _, _, name in targets if name in existing and name not in remaining]
          print(f"Confirmed retired namespaces removed: {len(removed)}")
          print(f"Account namespace count after cleanup: {len(after)}")
          for _, _, namespace in targets:
              if namespace in remaining:
                  print(f"Still present: {namespace}")
          if len(after) >= 100:
              raise SystemExit("Account remains at or above the 100-namespace limit.")
          PY
