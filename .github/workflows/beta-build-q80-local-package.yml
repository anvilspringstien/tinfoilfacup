name: BETA build local q80 retest package

on:
  push:
    branches:
      - beta/q80-local-package-20261001

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/q80-local-package-20261001
          fetch-depth: 0

      - name: Fetch demand-loaded Deck branch
        run: git fetch origin beta/controlled-deck-warmer-20261001

      - name: Build local package
        run: |
          rm -rf q80-local-package
          mkdir -p q80-local-package/assets
          git show origin/beta/controlled-deck-warmer-20261001:beta/challenges-beta.html > q80-local-package/challenges-beta.html
          cp -R beta/assets/. q80-local-package/assets/
          rm -f q80-local-package/assets/challenge-mats/*.webp
          cp beta/assets/challenge-fronts-q80/*.webp q80-local-package/assets/challenge-mats/
          cp beta/assets/challenge-backs-q80/*.webp q80-local-package/assets/challenge-mats/
          test "$(find q80-local-package/assets/challenge-mats -name 'mat-*.webp' | wc -l)" -eq 56
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path("q80-local-package/assets/challenge-mats").glob("mat-*.webp"))
          assert len(files)==56
          html=Path("q80-local-package/challenges-beta.html").read_text()
          assert 'entry.img=null;' in html
          assert '// The hidden reverse is demand-loaded:' in html
          print("Local package verification: PASS")
          PY

      - name: Zip package
        run: |
          rm -f beta/TFFC-q80-local-retest.zip
          (cd q80-local-package && zip -qr ../beta/TFFC-q80-local-retest.zip .)
          ls -lh beta/TFFC-q80-local-retest.zip

      - name: Remove builder and commit package
        run: |
          rm -f .github/workflows/beta-build-q80-local-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/TFFC-q80-local-retest.zip .github/workflows/beta-build-q80-local-package.yml
          git commit -m "BETA: add local q80 Deck retest package"
          git push origin HEAD:beta/q80-local-package-20261001
