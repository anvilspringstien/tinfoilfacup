name: BETA fronts-first Deck warmer check

on:
  push:
    branches:
      - beta/controlled-deck-warmer-20261001
    paths:
      - beta/challenges-beta.html
      - tests/test_beta_controlled_deck_warmer.js
      - tests/test_beta_challenges_startup_load.js
      - .github/workflows/beta-fronts-first-warmer-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused BETA regressions
        run: |
          node tests/test_beta_controlled_deck_warmer.js
          node tests/test_beta_challenges_startup_load.js
          node tests/test_beta_cabinet_thumbnails.js
          node tests/test_beta_trophy_viewer.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_preload.js
