name: Ground exception verification (v7.6.8)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify and refine ground exceptions
        run: python updater/ground_exception_verification.py
      - name: Commit dashboard
        run: |
          git config user.name "Tin Foil FA Cup Ground Verification"
          git config user.email "actions@users.noreply.github.com"
          git add ground-exception-verification.md updater/ground-exception-verification.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update ground exception verification"; git push; fi
