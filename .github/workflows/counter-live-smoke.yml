name: Counter Live Smoke Check
on:
  push:
    paths:
      - '.github/workflows/counter-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Worker health
        run: |
          set -euxo pipefail
          curl -fsS -D /tmp/health-headers.txt https://tffac-clubfinder-counter.anvilspringstien.workers.dev/health
          cat /tmp/health-headers.txt
      - name: Live counter config
        run: |
          set -euxo pipefail
          curl -fsS -D /tmp/config-headers.txt https://anvilspringstien.github.io/tinfoilfacup/counter-config.json
          cat /tmp/config-headers.txt
      - name: CORS preflight from GitHub Pages
        run: |
          set -euxo pipefail
          curl -sS -o /tmp/preflight-body.txt -D /tmp/preflight-headers.txt -X OPTIONS \
            -H 'Origin: https://anvilspringstien.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            https://tffac-clubfinder-counter.anvilspringstien.workers.dev/increment
          cat /tmp/preflight-headers.txt
          cat /tmp/preflight-body.txt || true
          grep -qi '^HTTP/.* 204' /tmp/preflight-headers.txt
          grep -qi '^access-control-allow-origin: https://anvilspringstien.github.io' /tmp/preflight-headers.txt
