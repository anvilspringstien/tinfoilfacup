name: Ground geography coordinate validation (v7.7.6)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate geography coordinates independently
        run: python updater/geography_coordinate_validation.py
      - name: Commit validation report
        run: |
          git config user.name "Tin Foil FA Cup Geography Validator"
          git config user.email "actions@users.noreply.github.com"
          git add ground-geography-coordinate-validation.md updater/geography-coordinate-validation.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update geography coordinate validation v7.7.6"
            git push
          fi
