name: One-time guarded BETA offline snapshot refresh

on:
  push:
    branches: ['fix/beta-offline-snapshot-20260925']
    paths:
      - '.github/workflows/one-time-beta-snapshot-20260925.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to refresh from an out-of-date canonical baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: main has advanced; re-audit canonical competition before refreshing"
            exit 1
          }
      - name: Refresh only BETA offline fallback from committed competition
        run: |
          set -euo pipefail
          python3 updater/refresh_beta_embedded_snapshot.py
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 -m unittest discover -s tests -p 'test_beta_embedded_snapshot_refresh.py' -v
      - name: Execute real BETA producer and independent Deck regressions
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Protect venue, replay, conditional draw and mobile behaviour
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
          python3 updater/patch_beta_mobile_pigeon_name.py --check
      - name: Recheck main and prove the refreshed snapshot is the sole file edit
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: main advanced during refresh; reconcile before committing"
            exit 1
          }
          git diff --exit-code origin/main...HEAD -- clubfinder.html beta/challenges-beta.html competition.json
          git diff --exit-code -- clubfinder.html beta/challenges-beta.html competition.json
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: changed files were not exactly BETA Clubfinder: $changed"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ABORT: unexpected untracked test output"
            exit 1
          fi
      - name: Commit tested BETA snapshot on isolated branch only
        if: github.ref == 'refs/heads/fix/beta-offline-snapshot-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup BETA Snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          if [ "$(git diff --cached --name-only)" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: staged file drift"
            exit 1
          fi
          git commit -m "data(beta): refresh offline fallback from canonical competition"
          git push origin HEAD:fix/beta-offline-snapshot-20260925
