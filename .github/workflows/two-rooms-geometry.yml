name: Two rooms same geometry (Shed)
on:
  pull_request:
    paths:
      - 'beta/two-rooms*'
      - 'tests/two-rooms-geometry.mjs'
      - '.github/workflows/two-rooms-geometry.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/two-rooms-geometry.mjs
