name: BETA Weston replay/Stats guarded repair
on:
  push:
    branches: ['beta/weston-replay-stats-20260924']
    paths:
      - 'updater/patch_beta_weston_replay_stats.py'
      - 'tests/test_beta_weston_replay_stats.js'
      - '.github/workflows/beta-weston-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beta-weston-repair-20260924
  cancel-in-progress: false
jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/beta/weston-replay-stats-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Patch BETA only with fail-closed source boundaries
        run: python updater/patch_beta_weston_replay_stats.py
      - name: Verify real published Weston replay and local Stats logic
        run: node tests/test_beta_weston_replay_stats.js
      - name: Verify all existing BETA campaign and draw regressions
        run: |
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Guard offline fallback parity with canonical data
        run: |
          python updater/refresh_beta_embedded_snapshot.py --check
          python tests/test_beta_embedded_snapshot_refresh.py
      - name: Prove updater is byte-for-byte idempotent
        run: |
          sha256sum beta/clubfinder-beta.html > /tmp/beta-before.sha256
          python updater/patch_beta_weston_replay_stats.py
          sha256sum beta/clubfinder-beta.html > /tmp/beta-after.sha256
          diff -u /tmp/beta-before.sha256 /tmp/beta-after.sha256
      - name: Guard exclusive BETA mutation
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed not in ({'beta/clubfinder-beta.html'},set()):
            raise SystemExit('Unsafe changed files: '+str(changed))
          print('Only allowed BETA HTML changed:', changed)
          PY
          git diff --stat -- beta/clubfinder-beta.html
      - name: Commit tested BETA fix on this isolated branch only
        run: |
          if ! git diff --quiet -- beta/clubfinder-beta.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add beta/clubfinder-beta.html
            git commit -m "BETA: correct Weston replay time, shootout display and Stats accounting"
            git push origin HEAD:beta/weston-replay-stats-20260924
          else
            echo "BETA patch already committed; tests passed."
          fi
