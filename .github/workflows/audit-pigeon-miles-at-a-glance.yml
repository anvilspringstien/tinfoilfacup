name: Audit Pigeon Miles At a Glance

on:
  push:
    branches:
      - feature/pigeon-miles-at-a-glance
    paths:
      - .github/workflows/audit-pigeon-miles-at-a-glance.yml
      - updater/audit_pigeon_miles_at_a_glance.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Stats At-a-Glance snippets
        run: python updater/audit_pigeon_miles_at_a_glance.py
      - name: Commit audit report
        run: |
          git config user.name "Tin Foil FA Cup Audit"
          git config user.email "actions@users.noreply.github.com"
          git add pigeon-miles-at-a-glance-audit.md
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "Record Pigeon Miles At-a-Glance audit"
            git push
          fi
