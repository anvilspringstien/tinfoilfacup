name: Experiment No Legacy Preliminary Tables

on:
  push:
    branches:
      - experiment/no-legacy-prelim
    paths:
      - .github/workflows/experiment-no-legacy-prelim.yml
      - updater/experiment_disable_legacy_prelim_tables.py
      - updater/audit_epr_canonical_coverage.py
      - updater/audit_epr_migration_readiness.py

permissions:
  contents: read

jobs:
  coverage:
    name: audit-epr-canonical-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare legacy EPR results with canonical competition data
        run: python updater/audit_epr_canonical_coverage.py
      - name: Assess legacy EPR migration readiness
        run: python updater/audit_epr_migration_readiness.py

  regress:
    strategy:
      fail-fast: false
      matrix:
        mode: [prelim, epr, both]
    name: regress-${{ matrix.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable selected legacy fallback data in working copy
        run: python updater/experiment_disable_legacy_prelim_tables.py ${{ matrix.mode }}
      - name: Verify canonical embedded competition snapshot remains intact
        run: python updater/embedded_snapshot_regression.py
      - name: Verify Pigeon Miles source guards
        run: python -m unittest tests/test_pigeon_miles_stats_patch.py
      - name: Run Clubfinder render regression
        run: node updater/clubfinder_render_regression.js
      - name: Run Stats certificate regression
        run: node updater/clubfinder_stats_regression.js
