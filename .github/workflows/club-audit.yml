name: Mission Control Club Audit (read-only)

on:
  pull_request:
    paths:
      - 'competition.json'
      - 'tester-club-postcodes.csv'
      - 'journey-club-registry.json'
      - 'clubfinder.html'
      - 'beta/clubfinder-beta.html'
      - 'updater/club_audit.py'
      - 'updater/club_entry_radar.py'
      - 'updater/audit_active_custodian_locations.py'
      - 'updater/round_state_engine.py'
      - 'updater/identity-variant-confirmation.json'
      - 'updater/club_website_verified_batch_*.json'
      - 'updater/club_website_audit_queue.json'
      - 'updater/club_website_queue.js'
      - 'updater/club_website_bulk_promote.js'
      - 'updater/club-audit-open-location-reviews.json'
      - 'updater/current-ground-name-ledger.json'
      - 'updater/apply_beta_current_ground_names.py'
      - 'updater/law2-verified-location-ledger.json'
      - 'updater/entrant-home-ground-evidence-2026.json'
      - 'updater/league_tier_readonly.py'
      - 'updater/league_tier_review.py'
      - 'updater/league_tier_approval.py'
      - 'updater/league-tier-sources/*.csv'
      - 'updater/league-tier-sources/*.json'
      - 'tests/test_club_audit.py'
      - 'docs/club-audit*'
      - 'docs/examples/club-audit-*.json'
      - '.github/workflows/club-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -p 'test_club_audit.py' -v
