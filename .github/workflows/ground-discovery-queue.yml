name: Ground discovery queue (v7.6.4)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build FCHD ground discovery queue
        run: python updater/ground_discovery_queue.py

      - name: Commit ground discovery dashboard
        run: |
          git config user.name "Tin Foil FA Cup Ground Discovery"
          git config user.email "actions@users.noreply.github.com"
          git add ground-discovery-queue.md updater/ground-discovery-queue.json
          if git diff --cached --quiet; then
            echo "Ground discovery queue unchanged."
          else
            git commit -m "Update ground discovery queue"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ground-discovery-queue
          path: |
            ground-discovery-queue.md
            updater/ground-discovery-queue.json
