name: Reconciliation Gate (read-only)
on:
  push:
    branches:
      - beta/reconciliation-gate-v1
    paths:
      - updater/reconciliation_gate.py
      - updater/reconciliation_gate_regression.py
      - .github/workflows/reconciliation-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic reconciliation regression
        run: python updater/reconciliation_gate_regression.py
      - name: Audit current branch data (expected to fail closed if divergent)
        shell: bash
        run: |
          set +e
          python updater/reconciliation_gate.py \
            --production competition.json \
            --candidate beta/competition-fallback.json > reconciliation-audit.json
          code=$?
          cat reconciliation-audit.json
          echo "Audit exit code: $code (diagnostic only; conflicts require review)"
          exit 0
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-audit
          path: reconciliation-audit.json
