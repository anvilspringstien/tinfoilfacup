name: Refresh FA Cup competition data

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Official FA draw PDF/page URL"
        required: true
      round_name:
        description: "Round name"
        required: true
        default: "First Round Qualifying"
      round_date:
        description: "Default match date YYYY-MM-DD"
        required: true
        default: "2026-09-05"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update competition JSON
        run: python updater/update_draw.py "${{ github.event.inputs.source_url }}" "${{ github.event.inputs.round_name }}" "${{ github.event.inputs.round_date }}"
        if: github.event_name == 'workflow_dispatch'
      - name: Commit changed competition data
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Tin Foil FA Cup Updater"
          git config user.email "actions@users.noreply.github.com"
          git add competition.json
          git diff --cached --quiet || git commit -m "Refresh FA Cup competition data"
          git push
