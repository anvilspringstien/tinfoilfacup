name: Groundshare evidence research — Batch 1 (v7.8.2)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build proposal-only Batch 1 evidence research
        run: python updater/groundshare_evidence_research_batch1.py
      - name: Commit Batch 1 evidence research
        run: |
          git config user.name "Tin Foil FA Cup Groundshare Research"
          git config user.email "actions@users.noreply.github.com"
          git add groundshare-evidence-research-batch1.md updater/groundshare-evidence-research-batch1.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update groundshare evidence research v7.8.2 batch 1"
            git push
          fi
