name: Ground identity variant confirmation (v7.7.9)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build confirmation-only identity report
        run: python updater/identity_variant_confirmation.py
      - name: Commit identity confirmation report
        run: |
          git config user.name "Tin Foil FA Cup Identity Confirmation"
          git config user.email "actions@users.noreply.github.com"
          git add ground-identity-variant-confirmation.md updater/identity-variant-confirmation.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update identity variant confirmation v7.7.9"
            git push
          fi
