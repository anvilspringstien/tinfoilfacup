name: Stage C guarded offline BETA competition snapshot refresh

on:
  push:
    branches: ['beta/refresh-offline-fallback-stage-c-20260925']
    paths:
      - '.github/workflows/beta-stage-c-snapshot-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-test-and-commit-isolated-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject a stale main or unexpected base
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: main advanced. Reconcile canonical competition data first."
            exit 1
          }
      - name: Refresh embedded BETA fallback only from verified canonical JSON
        run: |
          set -euo pipefail
          python3 updater/refresh_beta_embedded_snapshot.py
          python3 updater/refresh_beta_embedded_snapshot.py --check
          python3 -m unittest discover -s tests -p 'test_beta_embedded_snapshot_refresh.py' -v
          python3 updater/patch_beta_mobile_pigeon_name.py --check
          python3 updater/audit_beta_clubfinder_stage_c.py
          python3 updater/audit_beta_clubfinder_stage_c.py --check
      - name: Real Clubfinder identity, Challenge bridge, Trophy and navigation
        run: |
          set -euo pipefail
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Guard completed venues, merger, replay, Thame and conditional draws
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Verify protected files and exact snapshot-only diff
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: live competition data advanced while refreshing"
            exit 1
          }
          git diff --exit-code origin/main...HEAD -- \
            competition.json clubfinder.html beta/challenges-beta.html
          git diff --exit-code -- competition.json \
            clubfinder.html beta/challenges-beta.html
          # Stage C's original audit remains a deliberately historical report;
          # regenerate and check it above without updating it in this data PR.
          git restore -- docs/refactor/2026-09-25-stage-c-clubfinder-producer-map.md
          changed="$(git diff --name-only)"
          if [ "$changed" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: offline refresh changed files besides BETA Clubfinder: $changed"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ABORT: unexpected untracked refresh output"
            exit 1
          fi
      - name: Commit only tested BETA fallback to isolated branch
        if: github.ref == 'refs/heads/beta/refresh-offline-fallback-stage-c-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup BETA Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          if [ "$(git diff --cached --name-only)" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: staged files differ from BETA Clubfinder"
            exit 1
          fi
          git commit -m "data(beta): refresh embedded fallback from verified canonical competition"
          git push origin HEAD:beta/refresh-offline-fallback-stage-c-20260925
