name: Audit Clubfinder Size

on:
  push:
    branches:
      - audit/clubfinder-size
    paths:
      - .github/workflows/audit-clubfinder-size.yml
      - updater/audit_clubfinder_size.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Clubfinder size audit
        run: python updater/audit_clubfinder_size.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clubfinder-size-audit.md
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Report Clubfinder size audit [skip ci]"
          git push
