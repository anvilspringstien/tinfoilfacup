name: Read-only archived replay staging
on:
  pull_request:
    paths:
      - 'updater/stage_preceding_replay_candidates.py'
      - 'updater/audit_preceding_round_replays.py'
      - 'tests/test_archived_replay_source.py'
      - 'updater/guard_archived_replay_promotion.py'
      - 'tests/test_guard_archived_replay_promotion.py'
      - 'tests/test_stage_preceding_replay_candidates.py'
      - '.github/workflows/stage-preceding-replays.yml'
      - 'updater/reconcile_quarantined_replay_evidence.py'
      - 'tests/test_quarantined_replay_evidence.py'
      - 'updater/retrieve_quarantined_replay_evidence.py'
      - 'tests/test_retrieve_quarantined_replay_evidence.py'
      - 'updater/retrieve_any_quarantined_replay.py'
      - 'updater/discover_quarantined_replay_urls.py'
      - 'updater/discover_known_replay_pages.py'
      - 'tests/test_discover_known_replay_pages.py'
      - 'updater/verify_discovered_replay.py'
      - 'tests/test_discover_quarantined_replay_urls.py'
      - 'tests/test_retrieve_any_quarantined_replay.py'
  workflow_dispatch:
jobs:
  independent-corroboration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test free direct FA/BBC discovery
        run: python -m unittest discover -s tests -p 'test_discover_known_replay_pages.py' -v
      - name: Test automatic FA/BBC-first URL discovery
        run: python -m unittest discover -s tests -p 'test_discover_quarantined_replay_urls.py' -v
      - name: Test generic per-fixture source extraction and reconciliation
        run: python -m unittest discover -s tests -p 'test_retrieve_any_quarantined_replay.py' -v
      - name: Test source extraction and fail-closed evidence gate
        run: python -m unittest discover -s tests -p 'test_retrieve_quarantined_replay_evidence.py' -v
      - name: Fetch independent live reports and reconcile quarantined replay
        run: python updater/retrieve_quarantined_replay_evidence.py --fetch
      - name: Ensure no production files were touched
        if: always()
        run: git diff --exit-code -- competition.json clubfinder.html
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard dedicated archived replay source selection
        run: python -m unittest discover -s tests -p 'test_archived_replay_source.py' -v
      - name: Guard staging chronology and publication boundary
        run: python -m unittest discover -s tests -p 'test_stage_preceding_replay_candidates.py' -v
      - name: Guard independent quarantine evidence recovery
        run: python -m unittest discover -s tests -p 'test_quarantined_replay_evidence.py' -v
      - name: Guard partial promotion and independent penalty evidence
        run: python -m unittest discover -s tests -p 'test_guard_archived_replay_promotion.py' -v
      - name: Produce read-only source-backed promotion readiness report
        run: |
          python updater/audit_preceding_round_replays.py --fetch > /tmp/archived-replay-audit.json
          python updater/guard_archived_replay_promotion.py --audit /tmp/archived-replay-audit.json > /tmp/replay-promotion-readiness.json
          python -m json.tool /tmp/replay-promotion-readiness.json
      - name: Stage real preceding-round replay candidates in memory
        run: python updater/stage_preceding_replay_candidates.py --candidate-output /tmp/staged-replay-candidate.json | tee /tmp/staged-replays.json
      - name: Simulate full candidate state in isolated workspace
        run: |
          set -euo pipefail
          test -s /tmp/staged-replay-candidate.json
          SIM="$(mktemp -d)"
          cp -a . "$SIM/repository"
          cd "$SIM/repository"
          cp /tmp/staged-replay-candidate.json competition.json
          python updater/patch_clubfinder_competition_logic.py
          python updater/patch_clubfinder_replay_progression.py
          python updater/patch_clubfinder_journey_integrity.py
          python updater/patch_clubfinder_result_status.py
          python updater/patch_clubfinder_stats_integrity.py
          python updater/patch_clubfinder_pigeon_miles_stats.py
          python updater/patch_clubfinder_branding.py
          python updater/patch_clubfinder_law2_origins.py
          python updater/promote_verified_law2_locations.py
          python updater/audit_law2_location_verification.py
          python updater/patch_clubfinder_historical_venues.py
          python updater/patch_clubfinder_production_ui.py
          python updater/patch_clubfinder_campaign_identity.py
          python updater/refresh_clubfinder_embedded_snapshot.py
          python updater/reconcile_result_history_aliases.py --check
          python updater/extra_preliminary_replay_regression.py
          python updater/competition_regression_guard.py
          node updater/clubfinder_render_regression.js
          node updater/amersham_card_render_regression.js
          node updater/amersham_stats_regression.js
          node updater/ex8_venue_render_regression.js
          node updater/kt21_venue_render_regression.js
          node updater/law2_origin_regression.js
          node updater/replay_progression_regression.js
          python updater/kt21_replay_regression.py
          python updater/embedded_snapshot_regression.py
          node updater/clubfinder_stats_regression.js
          node updater/journey_integrity_regression.js
          node updater/historical_journey_regression.js
          node updater/historical_venue_regression.js
          node updater/production_ui_regression.js
          echo "ISOLATED CANDIDATE SIMULATION: ALL GUARDS PASSED"
      - name: Verify production remains byte-for-byte unchanged
        if: always()
        run: git diff --exit-code -- competition.json clubfinder.html
      - name: Show staged replay report
        if: always()
        run: |
          if test -s /tmp/staged-replays.json; then
            python -m json.tool /tmp/staged-replays.json
          fi
