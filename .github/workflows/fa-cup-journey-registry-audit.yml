name: FA Cup journey registry audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/audit_fa_cup_journey_registry.py'
      - 'updater/audit_journey_ground_coverage.py'
      - 'updater/audit_journey_source_of_truth.py'
      - '.github/workflows/fa-cup-journey-registry-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Run read-only journey registry audit
        run: python updater/audit_fa_cup_journey_registry.py

      - name: Run read-only journey ground coverage audit
        run: python updater/audit_journey_ground_coverage.py

      - name: Run read-only journey source-of-truth audit
        run: python updater/audit_journey_source_of_truth.py

      - name: Show audit summaries
        if: always()
        run: |
          if [ -f fa-cup-journey-registry-audit.md ]; then cat fa-cup-journey-registry-audit.md; fi
          if [ -f journey-ground-coverage-audit.md ]; then cat journey-ground-coverage-audit.md; fi
          if [ -f journey-source-of-truth-audit.md ]; then cat journey-source-of-truth-audit.md; fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-cup-journey-registry-audit
          path: |
            fa-cup-journey-registry-audit.md
            updater/fa-cup-journey-registry-audit.json
            updater/journey-club-verification-queue.json
            journey-ground-coverage-audit.md
            updater/journey-ground-coverage-audit.json
            journey-source-of-truth-audit.md
            updater/journey-source-of-truth-audit.json
          if-no-files-found: warn

# SAFETY: this workflow has contents: read only and contains no commit/push/write-back step.
