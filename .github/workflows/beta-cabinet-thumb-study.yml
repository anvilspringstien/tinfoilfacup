name: BETA Cabinet thumbnail quality study

on:
  push:
    branches:
      - beta/cabinet-thumbnails-20261001
    paths:
      - .github/workflows/beta-cabinet-thumb-study.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build representative thumbnail candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import hashlib, json

          root = Path("beta/assets/challenge-mats")
          out = Path("thumb-study")
          out.mkdir(exist_ok=True)

          samples = [
              ("heavy", root / "mat-06-front.webp"),
              ("middle", root / "mat-00-front.webp"),
              ("light", root / "mat-20-front.webp"),
          ]
          qualities = [80, 85, 90]
          report = []

          for label, src in samples:
              with Image.open(src) as im:
                  assert im.size == (640, 640), (src, im.size)
                  im = im.convert("RGB")
                  ref = im.resize((200, 200), Image.Resampling.LANCZOS)
                  ref.save(out / f"{label}-reference.png", optimize=True)
                  for q in qualities:
                      dest = out / f"{label}-q{q}.webp"
                      ref.save(dest, "WEBP", quality=q, method=6)
                      with Image.open(dest) as check:
                          assert check.size == (200, 200)
                      report.append({
                          "sample": label,
                          "source": src.name,
                          "source_bytes": src.stat().st_size,
                          "quality": q,
                          "thumb_bytes": dest.stat().st_size,
                          "sha256": hashlib.sha256(dest.read_bytes()).hexdigest(),
                      })

          # 4-column sheet: lossless 200px reference, then q80/q85/q90.
          cell = 400
          label_h = 44
          sheet = Image.new("RGB", (cell * 4, (cell + label_h) * len(samples)), "white")
          draw = ImageDraw.Draw(sheet)
          headers = ["200px reference", "WebP q80", "WebP q85", "WebP q90"]
          for row, (label, _src) in enumerate(samples):
              y0 = row * (cell + label_h)
              for col, title in enumerate(headers):
                  path = out / (f"{label}-reference.png" if col == 0 else f"{label}-q{qualities[col-1]}.webp")
                  with Image.open(path) as im:
                      im = im.convert("RGB").resize((cell, cell), Image.Resampling.NEAREST)
                      sheet.paste(im, (col * cell, y0))
                  draw.text((col * cell + 8, y0 + cell + 10), f"{label}: {title}", fill="black")
          sheet.save(out / "comparison.png", optimize=True)
          (out / "report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-thumb-study
          path: thumb-study/
          if-no-files-found: error
