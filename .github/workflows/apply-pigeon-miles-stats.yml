name: Apply Pigeon Miles Stats

on:
  push:
    branches:
      - feature/pigeon-miles-stats
    paths:
      - .github/workflows/apply-pigeon-miles-stats.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Pigeon Miles Stats patch
        run: python updater/patch_clubfinder_pigeon_miles_stats.py

      - name: Syntax check patcher
        run: python -m py_compile updater/patch_clubfinder_pigeon_miles_stats.py tests/test_pigeon_miles_stats_patch.py

      - name: Run Pigeon Miles Stats regression tests
        run: python -m unittest tests.test_pigeon_miles_stats_patch -v

      - name: Confirm Clubfinder Stats anchors
        run: |
          grep -Fq 'Pigeon Miles Travelled:' clubfinder.html
          grep -Fq '2*hav(start,venue)' clubfinder.html
          grep -Fq 'savedJourneyForStats&&savedJourneyForStats.postcode' clubfinder.html
          ! grep -Fq 'Travel mileage is deliberately not counted yet.' clubfinder.html

      - name: Commit Clubfinder update
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clubfinder.html
          git commit -m "Add Pigeon Miles to Clubfinder Stats [skip ci]"
          git push
