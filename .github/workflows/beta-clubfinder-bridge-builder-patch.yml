name: Stage C one-time guarded BETA Clubfinder bridge patch

on:
  push:
    branches: ['refactor/beta-clubfinder-pure-bridge-builder-20260925']
    paths:
      - 'updater/patch_beta_clubfinder_bridge_builder.py'
      - '.github/workflows/beta-clubfinder-bridge-builder-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-and-commit-on-isolated-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed if production main advanced since isolated branch
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: main advanced; reconcile audited sources before patch"
            exit 1
          }
      - name: Apply exact full-file BETA-only patch and verify its idempotence
        run: |
          set -euo pipefail
          python3 updater/patch_beta_clubfinder_bridge_builder.py
          python3 updater/patch_beta_clubfinder_bridge_builder.py --check
          python3 updater/patch_beta_mobile_pigeon_name.py --check
          python3 updater/audit_beta_clubfinder_stage_c.py
          python3 updater/audit_beta_clubfinder_stage_c.py --check
      - name: Execute real Clubfinder bridge, Deck, mobile and Trophy tests
        run: |
          set -euo pipefail
          node --check updater/beta_campaign_identity_regression.js
          node updater/beta_campaign_identity_regression.js
          node tests/test_beta_campaign_bridge_contract.js
          node tests/test_beta_challenges_direct_entry.js
          node tests/test_beta_trophy_viewer.js
      - name: Guard historical venues, replay resolution and conditional fixtures
        run: |
          set -euo pipefail
          node tests/test_beta_petts_wood_display_identity.js
          node tests/test_beta_holmesdale_campaign.js
          node tests/test_beta_exmouth_full_index.js
          node tests/test_beta_weston_replay_stats.js
          node tests/test_beta_thame_next_fixture.js
          node tests/test_beta_verified_conditional_replay.js
          node tests/test_beta_conditional_draw_alias.js
      - name: Prove only BETA Clubfinder was edited in the workspace
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "ABORT: live ingestion advanced while patching; reconcile before commit"
            exit 1
          }
          git diff --exit-code origin/main...HEAD -- \
            clubfinder.html beta/clubfinder-beta.html \
            beta/challenges-beta.html competition.json
          git diff --exit-code -- clubfinder.html \
            beta/challenges-beta.html competition.json
          # Stage C's reproducible Markdown source map is a *historical* report
          # on main. Regeneration is tested but is not committed with this
          # narrowly scoped code change; update the report separately.
          git restore -- docs/refactor/2026-09-25-stage-c-clubfinder-producer-map.md
          changed="$(git diff --name-only)"
          if [ "$changed" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: patch modified unexpected files: $changed"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ABORT: unexpected untracked files"
            exit 1
          fi
      - name: Commit only tested BETA Clubfinder edit on this isolated branch
        if: github.ref == 'refs/heads/refactor/beta-clubfinder-pure-bridge-builder-20260925'
        run: |
          set -euo pipefail
          git config user.name "Tin Foil FA Cup Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -- beta/clubfinder-beta.html
          if [ "$(git diff --cached --name-only)" != "beta/clubfinder-beta.html" ]; then
            echo "ABORT: staged files drifted"
            exit 1
          fi
          git commit -m "refactor(beta): extract tested pure Clubfinder bridge record builder"
          git push origin HEAD:refactor/beta-clubfinder-pure-bridge-builder-20260925
