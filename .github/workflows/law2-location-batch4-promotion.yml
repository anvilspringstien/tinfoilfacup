name: Law 2 location Batch 4 promotion

on:
  push:
    branches:
      - audit/law2-location-sweep-4-20260912
    paths:
      - '.github/workflows/law2-location-batch4-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add reviewed Batch 4 records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('updater/law2-verified-location-ledger.json')
          d=json.loads(p.read_text())
          add=[
            {'club':'AFC Telford United','ground':'New Bucks Head Stadium','postcode':'TF1 2TU','verified_at':'2026-09-12','sources':[{'type':'official_club','url':'https://telfordunited.com/contact','note':'AFC Telford United contact page gives the club address at SEAH Stadium, Watling Street, Wellington, Telford, TF1 2TU; this confirms the same stadium site/postcode despite current sponsorship naming.'}]},
            {'club':'Aldershot Town FC','ground':'EBB Stadium at The Recreation Ground','postcode':'GU11 1TW','verified_at':'2026-09-12','sources':[{'type':'official_club','url':'https://www.theshots.co.uk/terms-and-conditions/','note':'Aldershot Town FC official site identifies the club registered address as Recreation Ground, High Street, Aldershot, Hampshire, GU11 1TW.'}]},
            {'club':'Barrow AFC','ground':'Holker Street Ground','postcode':'LA14 5UW','verified_at':'2026-09-12','sources':[{'type':'official_club','url':'https://www.barrowafc.com/contact','note':'Barrow AFC contact page gives Barrow Bluebirds Limited at Holker Street Stadium, Wilkie Road, Barrow-in-Furness, Cumbria, LA14 5UW.'}]},
            {'club':'Boston United FC','ground':'Boston Community Stadium','postcode':'PE21 7NE','verified_at':'2026-09-12','sources':[{'type':'official_club','url':'https://www.bostonunited.co.uk/contact','note':'Boston United contact page gives The Jakemans Community Stadium, Pilgrim Way, Wyberton, Boston, Lincolnshire, PE21 7NE; this confirms the same community-stadium site/postcode despite sponsorship naming.'}]}
          ]
          existing={x['club'] for x in d['verified_locations']}
          for x in add:
            assert x['club'] not in existing, x['club']
            d['verified_locations'].append(x)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Promote guarded locations
        run: python updater/promote_verified_law2_locations.py
      - name: Rebuild audit
        run: python updater/audit_law2_location_verification.py
      - name: Regression
        run: node updater/law2_origin_regression.js
      - name: Assert Batch 4 totals and scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('updater/law2-location-verification-audit.json').read_text())
          c=p['counts']; r=p['remaining_review_by_entry_round']
          assert c.get('verified-canonical') == 6, c
          assert c.get('verified-supplemental') == 38, c
          assert c.get('review-supporting-evidence') == 116, c
          assert sum(r.values()) == 116, r
          print('Batch 4 totals: PASS', r)
          PY
          git diff --quiet -- competition.json
          other="$(git status --porcelain -- . ':!.github/workflows/law2-location-batch4-promotion.yml' ':!clubfinder.html' ':!law2-location-verification-audit.md' ':!updater/law2-location-verification-audit.json' ':!updater/law2-verified-location-ledger.json')"
          test -z "$other"
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/law2-verified-location-ledger.json clubfinder.html law2-location-verification-audit.md updater/law2-location-verification-audit.json
          git commit -m "Promote verified Law 2 location Batch 4"
          git push
