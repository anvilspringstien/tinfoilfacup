name: Barry watchdog tests
on:
  pull_request:
    paths:
      - "beta/barry_schedule_watchdog.py"
      - "beta/test_barry_schedule_watchdog.py"
      - ".github/workflows/barry-watchdog-tests.yml"
      - "beta/barry_live_watch.py"
      - "beta/test_barry_live_watch.py"
      - ".github/workflows/barry-live-watch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run read-only watchdog regression tests
        run: python -m unittest discover -s beta -p "test_barry*watch.py" -v
