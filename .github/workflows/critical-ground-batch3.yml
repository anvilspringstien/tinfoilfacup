name: Critical ground batch 3 (v7.9.8)
on:
  workflow_dispatch:
  push:
    paths:
      - 'updater/publish_critical_ground_batch3.py'
      - '.github/workflows/critical-ground-batch3.yml'
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote ten independently validated critical ground records
        run: python updater/publish_critical_ground_batch3.py
      - name: Re-run Ground Health
        run: python updater/ground_health.py
      - name: Commit batch and Ground Health
        run: |
          git config user.name "Tin Foil FA Cup Ground Research"
          git config user.email "actions@users.noreply.github.com"
          git add clubfinder.html critical-ground-batch3.md updater/critical-ground-batch3.json ground-health.md updater/ground-health.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Publish critical ground batch 3 v7.9.8"
            git push
          fi
