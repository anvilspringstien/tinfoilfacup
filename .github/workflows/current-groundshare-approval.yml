name: Current groundshare approval (v7.7.2)
on:
  workflow_dispatch:
    inputs:
      mode: {description: "approve = ledger only; correct = ledger + optional canonical correction", required: true, type: choice, options: [approve, correct]}
      tenant: {description: "Tenant club", required: true, type: string}
      host: {description: "Host club", required: false, type: string}
      ground: {description: "Current ground", required: true, type: string}
      postcode: {description: "Current postcode", required: true, type: string}
      season: {description: "Season/current period", required: true, default: "2026-27", type: string}
      evidence: {description: "Evidence note", required: true, type: string}
      source_url: {description: "Public source URL", required: true, type: string}
      latitude: {description: "Required if CORRECT changes postcode", required: false, type: string}
      longitude: {description: "Required if CORRECT changes postcode", required: false, type: string}
      publish_canonical_correction: {description: "Publish canonical venue correction? (CORRECT only)", required: true, default: false, type: boolean}
permissions: {contents: write}
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record approval
        shell: bash
        run: |
          ARGS=(--mode "${{ inputs.mode }}" --tenant "${{ inputs.tenant }}" --host "${{ inputs.host }}" --ground "${{ inputs.ground }}" --postcode "${{ inputs.postcode }}" --season "${{ inputs.season }}" --evidence "${{ inputs.evidence }}" --source-url "${{ inputs.source_url }}")
          if [ -n "${{ inputs.latitude }}" ]; then ARGS+=(--lat "${{ inputs.latitude }}"); fi
          if [ -n "${{ inputs.longitude }}" ]; then ARGS+=(--lon "${{ inputs.longitude }}"); fi
          if [ "${{ inputs.publish_canonical_correction }}" = "true" ]; then ARGS+=(--publish-correction); fi
          python updater/current_groundshare_approval.py "${ARGS[@]}"
      - name: Re-run Ground Health
        run: python updater/ground_health.py
      - name: Commit
        run: |
          git config user.name "Tin Foil FA Cup Groundshare Approval"
          git config user.email "actions@users.noreply.github.com"
          git add groundshare-approval.md ground-health.md updater/ground-approval-ledger.json updater/groundshare-approval-run.json updater/ground-health.json
          if [ "${{ inputs.mode }}" = "correct" ] && [ "${{ inputs.publish_canonical_correction }}" = "true" ]; then git add clubfinder.html; fi
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Groundshare approval v7.7.2"; git push; fi
