name: Keep the Magic Shed preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'beta/keep-the-magic-shed*'
      - 'beta/share-popup-embed.html'
      - 'beta/share-destination.css'
      - 'beta/keep-magic-return.js'
      - 'beta/keep-magic-install.js'
      - 'beta/keep-the-magic-data.js'
      - 'beta/clubfinder-beta.html'
      - 'beta/assets/keep-magic/**'
      - 'tests/keep-the-magic-shed.mjs'
      - 'tests/keep-magic-install-regression.js'
      - '.github/workflows/keep-the-magic-shed.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'beta/keep-the-magic-shed*'
      - 'beta/share-popup-embed.html'
      - 'beta/share-destination.css'
      - 'beta/keep-magic-return.js'
      - 'beta/keep-magic-install.js'
      - 'beta/keep-the-magic-data.js'
      - 'beta/clubfinder-beta.html'
      - 'beta/assets/keep-magic/**'
      - 'tests/keep-the-magic-shed.mjs'
      - 'tests/keep-magic-install-regression.js'
      - '.github/workflows/keep-the-magic-shed.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check installation handover and backup guards
        run: |
          node tests/keep-the-magic-regression.js
          node tests/keep-magic-install-regression.js
      - name: Serve isolated preview and run browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/keep-magic-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tests/keep-the-magic-shed.mjs
      - name: Retain preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-the-magic-preview
          path: /tmp/tffc-*-magic-*.png
