name = "tffc-ombudsman"
main = "worker.mjs"
compatibility_date = "2026-10-14"
workers_dev = true

[triggers]
crons = ["20 * * * *"]

[[kv_namespaces]]
binding = "OMBUDSMAN_KV"
id = "592fac6fa2bb4d4f858fb057cf9f4f77"

[vars]
MAX_AGE_HOURS = "3"
RESULTS_WORKFLOW_ID = "scan-results.yml"
DRAW_WORKFLOW_ID = "scan-draw.yml"

# Existing KV namespace is declared above so GitHub deployments retain the binding.
# Configure STATUS_TOKEN, ALERT_RELAY_URL, and ALERT_RELAY_SECRET as encrypted Worker secrets.
# Never commit secret values or relay URLs.
