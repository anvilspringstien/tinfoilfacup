<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#444444"><title>Tin Foil FA Cup — Splash Preview</title>
<style>
:root{--cream:#f4eee0;--field:#4b4b4b;--edge:#8c8c8c}*{box-sizing:border-box}
