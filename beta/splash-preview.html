<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#444444"><title>Tin Foil FA Cup — Splash Preview</title>
<style>
:root{--cream:#f6f3e8;--field:#505050}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#373737;color:var(--cream)}
body{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-weight:300}
.stage{min-height:100svh;height:100svh;padding:clamp(6px,1.2vh,13px);display:flex}
.field{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--field);border:1px solid #818181;border-radius:12px}
.content{height:100%;width:100%;max-width:580px;margin:auto;display:flex;flex-direction:column;align-items:center;padding:0 0 clamp(9px,1.5vh,18px)}
.crest{display:block;object-fit:contain;width:83.333%;max-width:450px;height:auto;aspect-ratio:1;flex:0 1 auto;min-height:0;margin-top:8.333cqw}
.field{container-type:inline-size}
.intro{width:83.333%;margin-top:clamp(3px,0.9vh,11px);text-align:left}
h1{font-size:clamp(27px,8.88cqw,51px);font-weight:300;line-height:1.05;letter-spacing:-.025em;margin:0;white-space:nowrap}
h1 span{display:block;font-size:52.083%;line-height:1.2;letter-spacing:0}
p{font-size:clamp(13px,3.24cqw,20px);line-height:1.35;font-weight:300;text-align:left;align-self:center;width:max-content;max-width:90%;margin:clamp(9px,1.6vh,18px) 0 0}
p .line{display:block;white-space:nowrap}
a.start{display:block;text-decoration:none;color:var(--cream);background:#292724;border:1px solid #1c1b1a;border-radius:11px;padding:12px 30px;font-size:clamp(16px,4vw,20px);box-shadow:0 2px 6px #252525;flex:none;margin-top:auto;margin-bottom:auto}
a.start:focus-visible{outline:3px solid #fff;outline-offset:4px}
.grassroots{width:96%;font-size:clamp(8px,1.45cqw,11px);line-height:1.3;text-align:center;white-space:nowrap}
.grassroots .short{display:none}
@media(max-width:600px){.grassroots .full{display:none}.grassroots .short{display:inline}.grassroots{font-size:clamp(9px,2.5cqw,13px)}}
@media(max-height:760px){.crest{width:min(83.333%,38svh);margin-top:clamp(8px,1.6vh,15px)}.intro{margin-top:4px}p{margin-top:7px}a.start{padding:10px 26px}.content{padding-bottom:8px}}
@media(max-height:600px){.crest{width:min(76%,30svh)}h1{font-size:clamp(24px,7cqw,38px)}p{font-size:clamp(12px,2.8cqw,17px);margin-top:4px}a.start{padding:8px 20px}.grassroots{font-size:9px}}
