<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#444444"><title>Tin Foil FA Cup — Splash v25 BETA</title>
<style>

 const css='position:fixed;z-index:2147483647;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;background:#171717;color:white;padding:12px;border:2px solid #fff;border-radius:8px;font:12px/1.4 monospace;white-space:pre-wrap;box-sizing:border-box';

 function measure(){const splash=!!document.querySelector('.stage .field');const field=box(splash?'.stage .field':'#tffcFourLaws .tffcOuter');const crest=box(splash?'.stage .crest':'#tffcFourLaws .tffcCrest');const result={page:splash?'Splash':'Clubfinder',viewport:{width:innerWidth,height:innerHeight,visualWidth:visualViewport?.width,visualHeight:visualViewport?.height},field,crest,crestFromField:field&&crest?+(crest.top-field.top).toFixed(2):null,crestFromScreen:crest?.top??null};pre.textContent=JSON.stringify(result,null,2);return pre.textContent}
 button.onclick=async()=>{const value=measure();try{await navigator.clipboard.writeText(value);button.textContent='Copied!'}catch(e){const ta=document.createElement('textarea');ta.value=value;panel.append(ta);ta.select();button.textContent='Select and copy report below'}};

})();
