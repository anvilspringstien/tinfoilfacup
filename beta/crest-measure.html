<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFFC Crest Alignment Measurements</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font:14px/1.5 system-ui;background:#171410;color:#f5eddf}h1{font-size:20px}button{padding:12px 16px;font:inherit;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#302b25;padding:14px;border-radius:8px}iframe{width:100%;height:100svh;border:1px solid #777;display:block;margin:12px 0 24px}details{margin-top:18px}summary{cursor:pointer}</style><h1>Barry's Tape Measure 📏</h1><p>Loads the existing pages without changing them. Tap Measure after both have loaded. Copy the report back to ChatGPT.</p><button id="measure">Measure both pages</button> <button id="copy">Copy measurements</button><pre id="report">Waiting for pages…</pre><details><summary>View reference pages</summary><p>Locked Splash</p><iframe id="splash" src="splash-preview.html"></iframe><p>Clubfinder</p><iframe id="club" src="clubfinder-beta.html"></iframe></details><script>const out=document.getElementById('report');function rect(el){if(!el)return null;const r=el.getBoundingClientRect();return {top:+r.top.toFixed(1),left:+r.left.toFixed(1),width:+r.width.toFixed(1),height:+r.height.toFixed(1),bottom:+r.bottom.toFixed(1)}}function measure(id,fieldSel,crestSel){const f=document.getElementById(id),w=f.contentWindow,d=f.contentDocument;if(!d||!d.querySelector(crestSel))return {error:'Page not loaded'};const field=d.querySelector(fieldSel),crest=d.querySelector(crestSel),fr=rect(field),cr=rect(crest);return {viewport:{width:w.innerWidth,height:w.innerHeight},field:fr,crest:cr,screenTopToCrest:cr.top,fieldTopToCrest:+(cr.top-fr.top).toFixed(1),fieldLeftToCrest:+(cr.left-fr.left).toFixed(1),crestWidth:cr.width}}function run(){try{const a=measure('splash','.field','.crest'),b=measure('club','#tffcFourLaws .tffcOuter','#tffcFourLaws .tffcCrest');out.textContent=JSON.stringify({deviceViewport:{width:innerWidth,height:innerHeight},splash:a,clubfinder:b,difference:{crestTop:b.crest?.top-a.crest?.top,crestWidth:b.crest?.width-a.crest?.width,fieldTop:b.field?.top-a.field?.top,fieldWidth:b.field?.width-a.field?.width}},null,2)}catch(e){out.textContent='Measurement error: '+e.message}}document.getElementById('measure').onclick=run;document.getElementById('copy').onclick=()=>{const t=out.textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Copied'),()=>prompt('Copy:',t));else prompt('Copy:',t)};window.addEventListener('load',()=>setTimeout(run,900));</script></html>
