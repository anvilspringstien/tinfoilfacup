<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TFFC Splash v19 — Crest to Headline Spacing</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap');
:root{--cream:#f6f3e8;--field:#505050}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#373737;color:var(--cream)}
body{font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-weight:300}
.stage{height:100svh;min-height:0;padding:clamp(6px,1.2vh,13px);display:flex}
.field{container-type:inline-size;position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--field);border:1px solid #818181;border-radius:12px}
.content{height:100%;width:100%;max-width:580px;margin:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:clamp(9px,1.5vh,18px)}
.crest{display:block;object-fit:contain;width:83.333%;max-width:450px;height:auto;aspect-ratio:1;flex:none;margin-top:clamp(8px,7.2cqw,38px)}
.intro{width:83.333%;margin-top:clamp(16px,calc(5.2vh - 16px),30px);text-align:left;transform:translateX(clamp(15px,4.6cqw,25px))}
h1{font-size:clamp(42px,12.85cqw,73px);font-weight:300;line-height:1.04;letter-spacing:-.035em;margin:0;white-space:nowrap}
h1 span{display:block;font-size:52.083%;line-height:1.16;letter-spacing:0}
p{font-size:clamp(19px,5.05cqw,28px);line-height:1.28;font-weight:300;text-align:left;align-self:center;width:max-content;max-width:96%;margin:clamp(30px,5vh,47px) 0 0}
p{transform:translateY(-8px)}
p .line{display:block;white-space:nowrap}
a.start{display:block;text-decoration:none;color:var(--cream);background:#292724;border:1px solid #1c1b1a;border-radius:11px;padding:12px 30px;font-size:clamp(16px,4vw,20px);box-shadow:0 2px 6px #252525;flex:none;margin:clamp(14px,2.2vh,20px) 0 clamp(14px,2.2vh,20px)}
a.start:focus-visible{outline:3px solid #fff;outline-offset:4px}
.grassroots{width:98%;font-size:clamp(8px,1.45cqw,11px);line-height:1.3;text-align:center;white-space:nowrap;margin:0}
.grassroots .short{display:none}
@media(max-width:600px){.grassroots .full{display:none}.grassroots .short{display:inline}.grassroots{font-size:clamp(10px,2.6cqw,13px)}}
@media(max-height:720px){.crest{margin-top:clamp(6px,3.5cqw,18px)}.intro{margin-top:14px}p{margin-top:20px}a.start{margin-top:12px;margin-bottom:12px}.content{padding-bottom:6px}}
@media(max-height:720px){.content{justify-content:space-between}.crest{margin-top:6px}.intro{margin-top:0}p{margin-top:0}a.start{margin-top:0;margin-bottom:0}}
@media(max-height:635px){.crest{width:min(83.333%,43svh)}h1{font-size:clamp(29px,8.6cqw,47px)}p{font-size:clamp(14px,3.7cqw,20px)}a.start{padding:10px 30px;margin:8px 0}.grassroots{font-size:9px}}
@media(max-height:470px){.stage{height:auto;min-height:100svh}.field{overflow:visible}.content{min-height:100svh}.crest{width:min(60%,26svh)}}
