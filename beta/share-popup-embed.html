<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFFC BETA — Share pop-up experiment</title><style>*{box-sizing:border-box}body{margin:0;background:#232323;color:#faf9ec;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-weight:300}.demo{min-height:100svh;display:grid;place-content:center;text-align:center;padding:24px;gap:18px}.demo h1{font-size:24px;font-weight:300;margin:0}.demo p{max-width:340px;margin:0 auto;color:#ccc}button{cursor:pointer;font:inherit}.action{background:#084c61;color:white;border:1px solid #f9f9ef;border-radius:5px;padding:11px 18px;min-height:44px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;justify-content:center;align-items:center;padding:clamp(6px,1.2vh,13px);z-index:20}.panel{width:100%;max-width:500px;max-height:calc(100svh - 16px);overflow-y:auto;overscroll-behavior:contain;background:#100f0d;border:1px solid #818181;border-radius:12px;position:relative;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px)}.close{position:sticky;top:0;align-self:flex-end;background:transparent;color:white;border:0;border-radius:0;width:38px;height:38px;font-size:22px;line-height:1;z-index:1}.crest{width:min(76%,265px,30svh);height:auto;aspect-ratio:1;object-fit:contain;margin-top:-32px;pointer-events:none}.heading{font-size:clamp(44px,11vw,76px);line-height:1;font-weight:300;margin:0}.qrWrap{background:#fffff2;padding:clamp(9px,2vw,16px);width:min(80%,285px,35svh);aspect-ratio:1;display:grid;place-items:center}.qrWrap svg{width:100%;height:100%;image-rendering:auto}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.note{font-size:12px;text-align:center;max-width:320px;margin:0;color:#f0eadb}.feedback{min-height:1.3em;font-size:13px;text-align:center;color:#fff}body.modalOpen{overflow:hidden}@media(max-height:650px){.panel{gap:7px;padding:6px 10px}.crest{width:min(64%,185px,27svh);margin-top:-28px}.heading{font-size:42px}.qrWrap{width:min(66%,220px,33svh)}.close{width:32px;height:32px;font-size:19px}}.keep-magic{display:block;text-align:center;text-decoration:none;flex-shrink:0;font-size:16px}</style></head><body><main class="demo"><h1>Share pop-up — isolated BETA experiment</h1><p>The accepted Splash and Clubfinder pages are not changed. Tap Share to test the proposed footer action.</p><button class="action" id="open">Share</button></main><div class="overlay" id="overlay" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="shareHeading"><button class="close" id="close" aria-label="Close Share">×</button><img class="crest" src="tffc-splash-logo-q80.webp" alt="Tin Foil FA Cup Clubfinder crest"><h2 class="heading" id="shareHeading">Share</h2><div class="qrWrap" id="qr" aria-label="QR code linking to Tin Foil FA Cup homepage"></div><p class="note">Scan to open Tin Foil FA Cup</p><div class="buttons"><button class="action" id="copy">Copy Link</button><button class="action" id="native">Share…</button></div><div class="feedback" id="feedback" role="status"></div><a class="action keep-magic" href="keep-the-magic-shed.html?instructions=1&amp;keep=1" target="_top">Keep the Magic</a></section></div><script>const URL_TO_SHARE='https://tinfoilfacup.com/';const QR_ROWS='111111101110010111000001101111111/100000101010101011100110101000001/101110101010101110100101101011101/101110100000110100110011101011101/101110100010010010100000001011101/100000101111010101000111101000001/111111101010101010101010101111111/000000001000000100011111000000000/001110101001001010100001111100111/100111000011001101000101011000101/001101101011101000111100010101010/011110011001000100110111001001100/010001110110000111101101110001010/001000010011000101001011001100101/101001101010100100100010011001110/010001010010000111111110101100110/001100111001010110100001010111101/101111010111111001011101101100000/010010110110100111100010011100111/010010010010110010010101101101101/011000100000000100000010011111011/101011000101101000101000100000001/100111100110100010101010000111110/101001000100001000011110100011110/100111101010010110101100111110000/000000001100101110010000100011111/111111100000011100101011101011110/100000100110010010011001100011111/101110101111011010001110111111011/101110101001100111000001010011010/101110101101001011011110111000000/100000100001111010010100011101000/111111100011100101111101111000110'.split('/');const ns='http://www.w3.org/2000/svg';const QR_SIZE=QR_ROWS.length;const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','-4 -4 '+(QR_SIZE+8)+' '+(QR_SIZE+8));svg.setAttribute('role','img');svg.setAttribute('aria-label','QR code for Tin Foil FA Cup homepage');svg.setAttribute('shape-rendering','geometricPrecision');const INK='#084c61',PAPER='#fffff2';function addQrRect(x,y,width,height,fill,radius){const el=document.createElementNS(ns,'rect');el.setAttribute('x',x);el.setAttribute('y',y);el.setAttribute('width',width);el.setAttribute('height',height);el.setAttribute('fill',fill);if(radius)el.setAttribute('rx',radius);svg.append(el);}addQrRect(-4,-4,QR_SIZE+8,QR_SIZE+8,PAPER,0);const finderPositions=[[0,0],[QR_SIZE-7,0],[0,QR_SIZE-7]];function insideFinder(x,y){return finderPositions.some(([fx,fy])=>x>=fx&&x<fx+7&&y>=fy&&y<fy+7)}QR_ROWS.forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='1'&&!insideFinder(x,y))addQrRect(x,y,1,1,INK,.23)}));finderPositions.forEach(([x,y])=>{addQrRect(x,y,7,7,INK,1.05);addQrRect(x+1,y+1,5,5,PAPER,.65);addQrRect(x+2,y+2,3,3,INK,.52)});document.getElementById('qr').append(svg);const overlay=document.getElementById('overlay'),open=document.getElementById('open'),close=document.getElementById('close'),feedback=document.getElementById('feedback');function shut(){overlay.hidden=true;document.body.classList.remove('modalOpen');open.focus()}function show(){overlay.hidden=false;document.body.classList.add('modalOpen');feedback.textContent='';close.focus()}open.onclick=show;close.onclick=shut;overlay.addEventListener('click',e=>{if(e.target===overlay)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)shut()});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(URL_TO_SHARE);feedback.textContent='Link copied'}catch(e){feedback.textContent='Copy unavailable — use Share… instead'}};const native=document.getElementById('native');if(!navigator.share)native.hidden=true;native.onclick=async()=>{try{await navigator.share({title:'Tin Foil FA Cup — Start Your Journey Here',url:URL_TO_SHARE})}catch(e){if(e.name!=='AbortError')feedback.textContent='Sharing unavailable — try Copy Link'}};</script><style>html,body{height:100%;background:transparent;overflow:hidden}.demo{display:none}.overlay{position:fixed;inset:0;background:transparent;padding:6px;overflow:hidden}.panel{max-height:calc(100svh - 12px);scrollbar-width:none}.panel::-webkit-scrollbar{display:none}@media(min-height:720px){.crest{width:min(82%,310px,34svh)}}</style><script>window.addEventListener('load',()=>{document.getElementById('open').click();const c=document.getElementById('close');c.onclick=()=>parent.postMessage({type:'tffc-share-close'},location.origin);document.getElementById('overlay').addEventListener('click',e=>{if(!e.target.closest('.panel'))parent.postMessage({type:'tffc-share-close'},location.origin)});document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'tffc-share-close'},location.origin)})});</script><style>
