<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFFC BETA — Share pop-up experiment</title><style>*{box-sizing:border-box}body{margin:0;background:#232323;color:#faf9ec;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-weight:300}.demo{min-height:100svh;display:grid;place-content:center;text-align:center;padding:24px;gap:18px}.demo h1{font-size:24px;font-weight:300;margin:0}.demo p{max-width:340px;margin:0 auto;color:#ccc}button{cursor:pointer;font:inherit}.action{background:#084c61;color:white;border:1px solid #f9f9ef;border-radius:5px;padding:11px 18px;min-height:44px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;justify-content:center;align-items:center;padding:clamp(6px,1.2vh,13px);z-index:20}.panel{width:100%;max-width:500px;max-height:calc(100svh - 16px);overflow-y:auto;overscroll-behavior:contain;background:#100f0d;border:1px solid #818181;border-radius:12px;position:relative;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px)}.close{position:sticky;top:0;align-self:flex-end;background:transparent;color:white;border:0;border-radius:0;width:38px;height:38px;font-size:22px;line-height:1;z-index:1}.crest{width:min(76%,265px,30svh);height:auto;aspect-ratio:1;object-fit:contain;margin-top:-32px;pointer-events:none}.heading{font-size:clamp(44px,11vw,76px);line-height:1;font-weight:300;margin:0}.qrWrap{background:#fffff2;padding:clamp(9px,2vw,16px);width:min(80%,285px,35svh);aspect-ratio:1;display:grid;place-items:center}.qrWrap svg{width:100%;height:100%;image-rendering:pixelated}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.note{font-size:12px;text-align:center;max-width:320px;margin:0;color:#f0eadb}.feedback{min-height:1.3em;font-size:13px;text-align:center;color:#fff}body.modalOpen{overflow:hidden}@media(max-height:650px){.panel{gap:7px;padding:6px 10px}.crest{width:min(64%,185px,27svh);margin-top:-28px}.heading{font-size:42px}.qrWrap{width:min(66%,220px,33svh)}.close{width:32px;height:32px;font-size:19px}}</style></head><body><main class="demo"><h1>Share pop-up — isolated BETA experiment</h1><p>The accepted Splash and Clubfinder pages are not changed. Tap Share to test the proposed footer action.</p><button class="action" id="open">Share</button></main><div class="overlay" id="overlay" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="shareHeading"><button class="close" id="close" aria-label="Close Share">×</button><img class="crest" src="tffc-splash-logo-q80.webp" alt="Tin Foil FA Cup Clubfinder crest"><h2 class="heading" id="shareHeading">Share</h2><div class="qrWrap" id="qr" aria-label="QR code linking to Tin Foil FA Cup homepage"></div><p class="note">Scan to open Tin Foil FA Cup</p><div class="buttons"><button class="action" id="copy">Copy Link</button><button class="action" id="native">Share…</button></div><div class="feedback" id="feedback" role="status"></div></section></div><script>const URL_TO_SHARE='https://tinfoilfacup.com/';const QR_ROWS='1111111010111110111101101110101111111/1000001001110010010011100001001000001/1011101001011110000111010000001011101/1011101011001011011111110110101011101/1011101011011000101111011111101011101/1000001011001110001101100110001000001/1111111010101010101010101010101111111/0000000010011010011000111011000000000/1000101111100110001100111111111111001/1111010100001110100111000100011110010/0110011110011110110010000001000100100/0100110100011010011000101011110001110/0100101100110001101110111000011001011/1011110001011000010100010011100011001/0101111010010111001101111111001111101/1111100101100011100111001101111110111/0001011011101100100010010101010111110/0110000100000100011100101110101001110/1101101011011101001101111100111011000/0001010000000001100111010010000110010/0111001000011010000000001001011100000/0010110100100000101111110101100110011/1000011111100000110010011001010111110/0110010100011110011000100010000110100/0100001110001011001100101111101011101/1000100111010010100111000100011110000/0000001001100110110010000011001100100/0011010100010110011000101011111001100/1100101111000101101110111000111111000/0000000011101110010100010000100010001/1111111010011011001101110110101010001/1000001000111011100111001100100011111/1011101010011110100010010100111111110/1011101000100110011100101110111101111/1011101000111101001101111000111001010/1000001001001111100111010001101010010/1111111011110100000000001011100100011'.split('/');const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','-4 -4 45 45');svg.setAttribute('role','img');svg.setAttribute('aria-label','QR code for Tin Foil FA Cup homepage');const bg=document.createElementNS(ns,'rect');bg.setAttribute('x',-4);bg.setAttribute('y',-4);bg.setAttribute('width',45);bg.setAttribute('height',45);bg.setAttribute('fill','#fffff2');svg.append(bg);let d='';QR_ROWS.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='1')d+='M'+x+' '+y+'h1v1h-1z'}));const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('fill','#000');svg.append(path);document.getElementById('qr').append(svg);const overlay=document.getElementById('overlay'),open=document.getElementById('open'),close=document.getElementById('close'),feedback=document.getElementById('feedback');function shut(){overlay.hidden=true;document.body.classList.remove('modalOpen');open.focus()}function show(){overlay.hidden=false;document.body.classList.add('modalOpen');feedback.textContent='';close.focus()}open.onclick=show;close.onclick=shut;overlay.addEventListener('click',e=>{if(e.target===overlay)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)shut()});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(URL_TO_SHARE);feedback.textContent='Link copied'}catch(e){feedback.textContent='Copy unavailable — use Share… instead'}};const native=document.getElementById('native');if(!navigator.share)native.hidden=true;native.onclick=async()=>{try{await navigator.share({title:'Tin Foil FA Cup Clubfinder',text:'Find your nearest eligible clubs and follow your Tin Foil FA Cup Campaign.',url:URL_TO_SHARE})}catch(e){if(e.name!=='AbortError')feedback.textContent='Sharing unavailable — try Copy Link'}};</script><style>html,body{height:100%;background:transparent;overflow:hidden}.demo{display:none}.overlay{position:fixed;inset:0;background:transparent;padding:6px;overflow:hidden}.panel{max-height:calc(100svh - 12px);scrollbar-width:none}.panel::-webkit-scrollbar{display:none}@media(min-height:720px){.crest{width:min(82%,310px,34svh)}}</style><script>window.addEventListener('load',()=>{document.getElementById('open').click();const c=document.getElementById('close');c.onclick=()=>parent.postMessage({type:'tffc-share-close'},location.origin);document.getElementById('overlay').addEventListener('click',e=>{if(!e.target.closest('.panel'))parent.postMessage({type:'tffc-share-close'},location.origin)});document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'tffc-share-close'},location.origin)})});</script></body></html>
