<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empty master — approved Splash frame and crest</title><style>
:root{--cream:#f6f3e8;--field:#100f0d}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#141210;color:var(--cream)}
body{font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-weight:300;background:radial-gradient(circle at 50% 8%,#27221c 0,#181512 38%,#100f0d 100%);background-attachment:fixed}
.stage{height:100svh;min-height:0;padding:clamp(6px,1.2vh,13px);display:flex}
.field{container-type:inline-size;position:relative;flex:1;min-width:0;min-height:0;max-width:628px;margin:0 auto;overflow:hidden;background:var(--field);border:1px solid #818181;border-radius:12px}
.content{height:100%;min-height:0;width:100%;max-width:580px;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-bottom:clamp(12px,2.4vh,24px)}
.crest{display:block;object-fit:contain;width:83.333%;max-width:450px;height:auto;aspect-ratio:1;flex:none;margin-top:clamp(8px,7.2cqw,38px)}
@media(max-height:720px){.crest{margin-top:6px}.content{padding-bottom:clamp(10px,1.6vh,14px)}}
@media(max-height:635px){.crest{width:83.333%}}
@media(max-height:599px){.crest{width:min(83.333%,43svh)}}
@media(max-height:470px){.crest{width:min(60%,26svh)}.content{padding-bottom:6px}}
@media(min-width:700px) and (max-height:850px){.stage{height:auto;min-height:100svh}.field{flex:initial;width:100%;min-height:calc(100svh - 2 * clamp(6px,1.2vh,13px));overflow:visible}.content{height:auto;min-height:calc(100svh - 2 * clamp(6px,1.2vh,13px));justify-content:flex-start;padding:0 12px 14px}.crest{width:83.333%;max-width:450px;margin-top:38px}}
@media(min-width:700px){html.tffc-viewport-fit .stage{zoom:var(--tffc-fit-scale,1)}}
</style></head><body><main class="stage"><section class="field" aria-label="Empty Splash master frame"><div class="content"><img class="crest" src="tffc-splash-logo-q80.webp" alt="Tin Foil FA Cup crest"></div></section></main></body></html>
