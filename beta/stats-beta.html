<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=980">
<title>Tin Foil FA Cup Stats</title>
<style>
:root{--deep:#084c61;--paper:#f4efe3;--ink:#17130f}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  display:grid;
  place-items:center;
  padding:24px;
  background:#ededed;
  color:var(--deep);
  font-family:Arial,sans-serif;
}
.prep-card{
  width:min(420px,calc(100vw - 40px));
  padding:28px 24px 26px;
  border:1px solid #d7d2c8;
  border-radius:10px;
  background:#fafafa;
  box-shadow:0 12px 28px rgba(0,0,0,.12);
  text-align:center;
}
.prep-kicker{
  margin:0 0 12px;
  font:800 11px/1 Arial,sans-serif;
  letter-spacing:.14em;
  color:#6b6257;
}
.prep-title{
  margin:0;
  font:800 19px/1.15 Arial,sans-serif;
  letter-spacing:.02em;
  color:var(--deep);
}
.prep-copy{
  margin:12px auto 18px;
  max-width:300px;
  font:600 13px/1.4 Arial,sans-serif;
  color:#4a4742;
}
.prep-rollers{
  display:flex;
  justify-content:center;
  gap:6px;
}
.prep-rollers span{
  width:34px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  color:#111;
  background:
    linear-gradient(180deg,rgba(0,0,0,.08),transparent 18%,transparent 80%,rgba(0,0,0,.11)),
    var(--paper);
  box-shadow:inset 0 0 6px rgba(71,52,25,.22);
  font:900 24px/1 Georgia,"Times New Roman",serif;
  animation:roll 1.2s steps(10,end) infinite;
}
.prep-rollers span:nth-child(2){animation-delay:.12s}
.prep-rollers span:nth-child(3){animation-delay:.24s}
@keyframes roll{
  0%{transform:translateY(0)}
  45%{transform:translateY(-1px)}
  55%{transform:translateY(1px)}
  100%{transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .prep-rollers span{animation:none}
}
</style>

</head>
<body>
  <main class="prep-card" aria-live="polite" aria-busy="true">
    <div class="prep-kicker">TIN FOIL FA CUP</div>
    <h1 class="prep-title">Preparing Your Stats…</h1>
    <p class="prep-copy">Checking your Campaign and calculating Pigeon Miles</p>
    <div class="prep-rollers" aria-hidden="true">
      <span>3</span><span>7</span><span>1</span>
    </div>
  </main>
  <script>
  (()=> {
    const rollers=[...document.querySelectorAll('.prep-rollers span')];
    if(!rollers.length || (window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
    let tick=0;
    window.setInterval(()=>{
      tick=(tick+1)%10;
      rollers.forEach((roller,index)=>{roller.textContent=String((tick+(index*3))%10);});
    },180);
  })();
  </script>
  <script>
// First visit reuses the Clubfinder tab that already holds the verified data.
// On a real refresh, use the canonical route so new competition data is fetched.
// If the opener is gone or inaccessible, the canonical route remains the fallback.
(async function(){
  const canonical="clubfinder-beta.html?stats=1";
  const marker="tffc.stats-fast-open.v1";
  try{
    if(sessionStorage.getItem(marker)==="1"){
      sessionStorage.removeItem(marker);
      window.location.replace(canonical);
      return;
    }
    sessionStorage.setItem(marker,"1");
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const source=window.opener;
    if(source && !source.closed &&
       source.location.origin===window.location.origin &&
       typeof source.tinFoilRenderStatsFromOpener==="function" &&
       await source.tinFoilRenderStatsFromOpener(window))return;
  }catch(_){}
  window.location.replace(canonical);
})();
</script>
</body>
</html>
