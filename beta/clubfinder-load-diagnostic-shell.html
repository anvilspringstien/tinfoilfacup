<!doctype html><html lang="en-GB"><head><script>
(()=>{
  const MODE="shell";
  const q=new URLSearchParams(location.search||'');
  const slowMs=Math.min(10000,Math.max(0,Number(q.get('slow'))||0));
  const marks=Object.create(null),resources=Object.create(null);
  let renderTimer=null,competitionWatch=null;
  const round=n=>Number.isFinite(Number(n))?Math.round(Number(n)*10)/10:null;
  function mark(name,value=performance.now()){
    if(marks[name]==null){marks[name]=round(value);scheduleRender();}
    return marks[name];
  }
  window.__tffcDiagMark=mark;
  window.__tffcDiagMode=MODE;
  window.__tffcDiagSlowMs=slowMs;
  mark('diagnosticStart');

  const nativeFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    const url=String((input&&input.url)||input||'');
    const isCompetition=/competition(?:-fallback)?\.json(?:[?#]|$)/.test(url);
    if(isCompetition)mark('competitionRequestStart');
    try{
      const response=await nativeFetch(input,init);
      if(isCompetition){
        mark('competitionResponseHeaders');
        if(!competitionWatch){
          competitionWatch=setInterval(()=>{
            try{
              if(typeof LIVE_DATA_STATUS!=='undefined'&&LIVE_DATA_STATUS&&LIVE_DATA_STATUS.state!=='loading'){
                mark('competitionReady');
                clearInterval(competitionWatch);competitionWatch=null;
              }
            }catch(e){}
          },20);
        }
      }
      return response;
    }catch(err){
      if(isCompetition)mark('competitionFetchError');
      throw err;
    }
  };

  try{
    const po=new PerformanceObserver(list=>{
      for(const e of list.getEntries()){
        if(e.entryType==='paint'){
          if(e.name==='first-paint')mark('firstPaint',e.startTime);
          if(e.name==='first-contentful-paint')mark('firstContentfulPaint',e.startTime);
        }else if(e.entryType==='resource'){
          const name=String(e.name||'');
          if(/clubfinder-shell-prototype-engine\.js/.test(name)){
            resources.engine={start:round(e.startTime),responseEnd:round(e.responseEnd),duration:round(e.duration),
              transferSize:e.transferSize||0,encodedBodySize:e.encodedBodySize||0,decodedBodySize:e.decodedBodySize||0};
            mark('engineResourceStart',e.startTime);mark('engineResourceEnd',e.responseEnd);
          }
          if(/competition(?:-fallback)?\.json/.test(name)){
            resources.competition={name:name.split('/').pop().split('?')[0],start:round(e.startTime),
              responseEnd:round(e.responseEnd),duration:round(e.duration),transferSize:e.transferSize||0,
              encodedBodySize:e.encodedBodySize||0,decodedBodySize:e.decodedBodySize||0};
          }
          scheduleRender();
        }
      }
    });
    po.observe({type:'paint',buffered:true});
    po.observe({type:'resource',buffered:true});
  }catch(e){}

  function attachUserJourney(){
    const input=document.getElementById('postcode'),button=document.getElementById('findBtn');
    const results=document.getElementById('results');
    if(input){
      input.addEventListener('input',()=>mark('firstKeystroke'),{capture:true,once:true});
      input.addEventListener('keydown',e=>{if(e.key==='Enter')mark('findClick')},{capture:true});
    }
    if(button)button.addEventListener('click',()=>mark('findClick'),{capture:true});
    if(results&&typeof MutationObserver==='function'){
      const inspect=()=>{
        const txt=String(results.textContent||'');
        if(results.style.display!=='none'&&(/Tin Foil FA Cup Campaign/i.test(txt)||results.querySelector('.result')))mark('campaignsRendered');
      };
      new MutationObserver(inspect).observe(results,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['style','class']});
      inspect();
    }
  }

  document.addEventListener('DOMContentLoaded',()=>{
    mark('domContentLoaded');
    if(document.getElementById('postcode')&&document.getElementById('findBtn'))mark('shellDOMReady');
    attachUserJourney();
    requestAnimationFrame(()=>mark('firstRAF'));
  },{once:true});
  window.addEventListener('load',()=>mark('windowLoad'),{once:true});

  function navData(){
    const n=performance.getEntriesByType('navigation')[0];
    if(!n)return {};
    return {
      domainLookupStart:round(n.domainLookupStart),domainLookupEnd:round(n.domainLookupEnd),
      connectStart:round(n.connectStart),secureConnectionStart:round(n.secureConnectionStart),
      connectEnd:round(n.connectEnd),requestStart:round(n.requestStart),
      responseStart:round(n.responseStart),responseEnd:round(n.responseEnd),
      domInteractive:round(n.domInteractive),domContentLoaded:round(n.domContentLoadedEventEnd),
      loadEventEnd:round(n.loadEventEnd),transferSize:n.transferSize||0,
      encodedBodySize:n.encodedBodySize||0,decodedBodySize:n.decodedBodySize||0
    };
  }
  function delta(a,b){return marks[a]!=null&&marks[b]!=null?round(marks[b]-marks[a]):null;}
  function snapshot(){
    return {
      mode:MODE,slowEngineMs:slowMs,url:location.href,navigation:navData(),
      marks:{...marks},resources:{...resources},
      intervals:{
        firstKeystrokeToFind:delta('firstKeystroke','findClick'),
        findToCampaigns:delta('findClick','campaignsRendered'),
        engineResource:delta('engineResourceStart','engineResourceEnd'),
        competitionRequestToReady:delta('competitionRequestStart','competitionReady')
      },
      userAgent:navigator.userAgent
    };
  }
  function humanReport(){
    const s=snapshot(),n=s.navigation,m=s.marks,r=s.resources;
    const row=(label,v)=>label.padEnd(29)+' '+(v==null?'—':v+' ms');
    const lines=[
      'TFFC LOAD DIAGNOSTICS — '+MODE.toUpperCase(),
      'slow engine delay: '+slowMs+' ms','',
      row('Navigation response start',n.responseStart),
      row('Navigation response end',n.responseEnd),
      row('Shell DOM ready',m.shellDOMReady),
      row('First paint',m.firstPaint),
      row('First contentful paint',m.firstContentfulPaint),
      row('Engine ready',m.engineReady),
      row('Competition request start',m.competitionRequestStart),
      row('Competition ready',m.competitionReady),
      row('First keystroke',m.firstKeystroke),
      row('Find clicked',m.findClick),
      row('Campaigns rendered',m.campaignsRendered),'',
      'Navigation transfer: '+(n.transferSize||0)+' bytes',
      'Navigation encoded body: '+(n.encodedBodySize||0)+' bytes',
      'Navigation decoded body: '+(n.decodedBodySize||0)+' bytes'
    ];
    if(r.engine)lines.push('Engine resource: '+JSON.stringify(r.engine));
    if(r.competition)lines.push('Competition resource: '+JSON.stringify(r.competition));
    lines.push('','COPY JSON:',JSON.stringify(s,null,2));
    return lines.join('\n');
  }
  function ensurePanel(){
    if(!document.body)return null;
    let box=document.getElementById('tffcLoadDiagnostics');
    if(box)return box;
    box=document.createElement('section');
    box.id='tffcLoadDiagnostics';
    box.style.cssText='width:100%;max-width:600px;margin:18px 0 24px;padding:12px;border:2px dashed #084c61;border-radius:5px;background:#fafafa;color:#111;font:12px/1.4 monospace;white-space:normal';
    box.innerHTML='<div style="font:600 14px Poppins,Arial,sans-serif;color:#084c61;margin-bottom:8px">Performance Diagnostics — '+MODE+'</div>'+
      '<button id="tffcDiagCopy" type="button" style="padding:6px 10px;margin-bottom:8px">Copy results</button>'+
      '<pre id="tffcDiagOutput" style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere"></pre>';
    document.body.appendChild(box);
    box.querySelector('#tffcDiagCopy').addEventListener('click',async()=>{
      const t=humanReport();
      try{await navigator.clipboard.writeText(t);box.querySelector('#tffcDiagCopy').textContent='Copied';}
      catch(e){box.querySelector('#tffcDiagOutput').textContent=t;}
    });
    return box;
  }
  function render(){renderTimer=null;const box=ensurePanel();if(box)box.querySelector('#tffcDiagOutput').textContent=humanReport();}
  function scheduleRender(){if(renderTimer==null)renderTimer=setTimeout(render,60);}
  document.addEventListener('DOMContentLoaded',scheduleRender,{once:true});
  window.addEventListener('load',scheduleRender,{once:true});
  setInterval(scheduleRender,750);
})();

<body><div id="searchPanel"><input id="postcode" aria-label="UK postcode" placeholder="Enter Your Postcode" autocomplete="postal-code" maxlength="10"><button id="findBtn">Find My Club</button></div><div id="liveDataTools"><span id="liveDataBadge">Using embedded competition snapshot</span></div><div id="status"></div><div id="results"></div><script>
/* TFFC SHELL-FIRST PROTOTYPE BOOTLOADER — isolated performance experiment */
(()=>{
  const __diagParams=new URLSearchParams(location.search||'');
  const __diagCold=__diagParams.get('cold')==='1';
  const __diagSlow=Math.min(10000,Math.max(0,Number(__diagParams.get('slow'))||0));
  const ENGINE_URL='./clubfinder-shell-prototype-engine.js'+(__diagCold?'?diagcold='+Date.now():'');
  const input=document.getElementById('postcode');
  const button=document.getElementById('findBtn');
  const status=document.getElementById('status');
  let started=false;
  let resolveReady,rejectReady;
  let pendingFind=false;
  let warmCompetition=false;
  window.__tffcPrototypeEngineReady=new Promise((resolve,reject)=>{resolveReady=resolve;rejectReady=reject});

  function warmCompetitionWhenReady(){
    warmCompetition=true;
    if(typeof window.tinFoilEnsureCompetitionReady==='function'){
      Promise.resolve(window.tinFoilEnsureCompetitionReady()).catch(()=>{});
    }
  }

  function loadEngine(){
    if(started)return window.__tffcPrototypeEngineReady;
    started=true;
    const script=document.createElement('script');
    script.src=ENGINE_URL;
    script.async=true;
    script.onload=()=>{
      window.__tffcDiagMark&&window.__tffcDiagMark('engineReady');
      resolveReady(true);
      if(warmCompetition)warmCompetitionWhenReady();
      if(pendingFind&&typeof window.go==='function'){
        pendingFind=false;
        window.go(true);
      }
    };
    script.onerror=()=>{
      if(status)status.textContent='Unable to load Clubfinder. Please refresh and try again.';
      rejectReady(new Error('Clubfinder prototype engine failed to load'));
    };
    const __attach=()=>{window.__tffcDiagMark&&window.__tffcDiagMark('engineRequestStart');document.head.appendChild(script);};
    window.__tffcDiagMark&&window.__tffcDiagMark('engineLoadRequested');
    if(__diagSlow>0){window.__tffcDiagMark&&window.__tffcDiagMark('engineDelayStart');setTimeout(__attach,__diagSlow);}else __attach();
    return window.__tffcPrototypeEngineReady;
  }

  if(input){
    input.addEventListener('input',()=>{
      input.value=input.value.toUpperCase();
      warmCompetitionWhenReady();
      loadEngine();
    });
    input.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&typeof window.go!=='function'){
        event.preventDefault();
        pendingFind=true;
        if(status)status.textContent='Preparing Clubfinder…';
        warmCompetitionWhenReady();
        loadEngine();
      }
    });
  }
  if(button){
    button.addEventListener('pointerdown',loadEngine);
    button.addEventListener('click',event=>{
      if(typeof window.go!=='function'){
        event.preventDefault();
        pendingFind=true;
        if(status)status.textContent='Preparing Clubfinder…';
        warmCompetitionWhenReady();
        loadEngine();
      }
    });
  }

  const urgent=new URLSearchParams(location.search||'').get('stats')==='1' ||
    new URLSearchParams(location.search||'').get('from')==='challenges-exit-v3';
  if(urgent){
    loadEngine();
  }else{
    const afterPaint=()=>requestAnimationFrame(()=>requestAnimationFrame(loadEngine));
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',afterPaint,{once:true});
    else afterPaint();
  }
  window.__tffcPrototypeLoadEngine=loadEngine;
})();
</script></body></html>
