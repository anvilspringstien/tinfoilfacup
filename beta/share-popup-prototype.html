<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFFC BETA — Share pop-up experiment</title><style>*{box-sizing:border-box}body{margin:0;background:#232323;color:#faf9ec;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-weight:300}.demo{min-height:100svh;display:grid;place-content:center;text-align:center;padding:24px;gap:18px}.demo h1{font-size:24px;font-weight:300;margin:0}.demo p{max-width:340px;margin:0 auto;color:#ccc}button{cursor:pointer;font:inherit}.action{background:#084c61;color:white;border:1px solid #f9f9ef;border-radius:5px;padding:11px 18px;min-height:44px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;justify-content:center;align-items:center;padding:clamp(6px,1.2vh,13px);z-index:20}.panel{width:100%;max-width:500px;max-height:calc(100svh - 16px);overflow-y:auto;overscroll-behavior:contain;background:#505050;border:1px solid #818181;border-radius:12px;position:relative;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px)}.close{position:sticky;top:0;align-self:flex-end;background:#242424;color:white;border:1px solid #bbb;border-radius:100%;width:38px;height:38px;font-size:22px;line-height:1;z-index:1}.crest{width:min(76%,265px,30svh);height:auto;aspect-ratio:1;object-fit:contain;margin-top:-32px;pointer-events:none}.heading{font-size:clamp(44px,11vw,76px);line-height:1;font-weight:300;margin:0}.qrWrap{background:#fffff2;padding:clamp(9px,2vw,16px);width:min(80%,285px,35svh);aspect-ratio:1;display:grid;place-items:center}.qrWrap svg{width:100%;height:100%;image-rendering:pixelated}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.note{font-size:12px;text-align:center;max-width:320px;margin:0;color:#f0eadb}.feedback{min-height:1.3em;font-size:13px;text-align:center;color:#fff}body.modalOpen{overflow:hidden}@media(max-height:650px){.panel{gap:7px;padding:6px 10px}.crest{width:min(64%,185px,27svh);margin-top:-28px}.heading{font-size:42px}.qrWrap{width:min(66%,220px,33svh)}.close{width:32px;height:32px;font-size:19px}}</style></head><body><main class="demo"><h1>Share pop-up — isolated BETA experiment</h1><p>The accepted Splash and Clubfinder pages are not changed. Tap Share to test the proposed footer action.</p><button class="action" id="open">Share</button></main><div class="overlay" id="overlay" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="shareHeading"><button class="close" id="close" aria-label="Close Share">×</button><img class="crest" src="tffc-splash-logo-q80.webp" alt="Tin Foil FA Cup Clubfinder crest"><h2 class="heading" id="shareHeading">Share</h2><div class="qrWrap" id="qr" aria-label="QR code linking to BETA Splash"></div><p class="note">Scan to open Tin Foil FA Cup Clubfinder v7.6 BETA</p><div class="buttons"><button class="action" id="copy">Copy Link</button><button class="action" id="native">Share…</button></div><div class="feedback" id="feedback" role="status"></div></section></div><script>const URL_TO_SHARE='https://anvilspringstien.github.io/tinfoilfacup/beta/splash-preview.html';const QR_ROWS='1111111001010110110000011000101111111/1000001001000110010010100101101000001/1011101011100110100001010000001011101/1011101010110011011000101111101011101/1011101010110000111110011100101011101/1000001011001100010010101001001000001/1111111010101010101010101010101111111/0000000010000010011001010001000000000/1011111001001010100100110101101111100/1110010100010111011011010100100101010/0001001101010011110100100001101000111/1011110001111011000111100011011100001/1011101101111111010100101111111010111/0111000001000100100110010100100100000/0100011110011001101001000011101111011/1001000010011001000111000010011110011/0001011011000100001110101111001110101/0100010011001011100000110110100100010/1010101111101000000011000111010100011/1000100000101010101001101001100100001/0101101111100000010000111110111010100/1110110000111110111101110000110001000/0011101000111011110001100001010111011/1010010011001100111101001001110110000/0100101010001010100000111110011010111/1100110000000101011011010010110101000/1000001001010001101101101111011011011/1000100100110001000111010011000001001/1000111110011011010100101111111111100/0000000010110010101110010011100011000/1111111001010101001011101100101010111/1000001011110010100011100000100011001/1011101010111101001000100111111110110/1011101011100011110000010000011010101/1011101010011100010001000101100000111/1000001001111000101011000010101010001/1111111011110110010110100110010011111'.split('/');const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','-4 -4 45 45');svg.setAttribute('role','img');svg.setAttribute('aria-label','QR code for BETA Splash');const bg=document.createElementNS(ns,'rect');bg.setAttribute('x',-4);bg.setAttribute('y',-4);bg.setAttribute('width',45);bg.setAttribute('height',45);bg.setAttribute('fill','#fffff2');svg.append(bg);let d='';QR_ROWS.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='1')d+='M'+x+' '+y+'h1v1h-1z'}));const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('fill','#000');svg.append(path);document.getElementById('qr').append(svg);const overlay=document.getElementById('overlay'),open=document.getElementById('open'),close=document.getElementById('close'),feedback=document.getElementById('feedback');function shut(){overlay.hidden=true;document.body.classList.remove('modalOpen');open.focus()}function show(){overlay.hidden=false;document.body.classList.add('modalOpen');feedback.textContent='';close.focus()}open.onclick=show;close.onclick=shut;overlay.addEventListener('click',e=>{if(e.target===overlay)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)shut()});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(URL_TO_SHARE);feedback.textContent='Splash link copied'}catch(e){feedback.textContent='Copy unavailable — use Share… instead'}};const native=document.getElementById('native');if(!navigator.share)native.hidden=true;native.onclick=async()=>{try{await navigator.share({title:'Tin Foil FA Cup Clubfinder',text:'Find your nearest eligible clubs and follow your Tin Foil FA Cup Campaign.',url:URL_TO_SHARE})}catch(e){if(e.name!=='AbortError')feedback.textContent='Sharing unavailable — try Copy Link'}};</script></body></html>
